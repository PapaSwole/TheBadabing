<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Badabing - Diagnostic Mode</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a24; font-family: sans-serif; color: #fff; }
        #error-box {
            position: absolute; top: 20px; left: 20px; right: 20px;
            background: rgba(255, 0, 0, 0.8); padding: 20px; border-radius: 8px;
            display: none; z-index: 100; font-size: 14px; white-space: pre-wrap;
        }
        #info { position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <div id="error-box"></div>
    <div id="info">Status: <span id="status" style="color: #ffaa00;">Loading 3D World...</span></div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const statusEl = document.getElementById('status');
        const errorBox = document.getElementById('error-box');

        window.onerror = function(msg, url, line) {
            errorBox.style.display = 'block';
            errorBox.innerText = `Error: ${msg}\nLine: ${line}\nUrl: ${url}`;
            statusEl.innerText = "Crashed!";
            statusEl.style.color = "#ff5555";
        };

        try {
            console.log("🚀 Initializing diagnostic scene...");
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x222233);

            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);
            camera.lookAt(0, 0, 0);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Add a simple bright cube and ground to prove rendering works
            const light = new THREE.DirectionalLight(0xffffff, 1);
            light.position.set(5, 10, 7);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0xffffff, 0.5));

            const cube = new THREE.Mesh(
                new THREE.BoxGeometry(2, 2, 2),
                new THREE.MeshStandardMaterial({ color: 0xff5555 })
            );
            cube.position.y = 1;
            scene.add(cube);

            const plane = new THREE.Mesh(
                new THREE.PlaneGeometry(20, 20),
                new THREE.MeshStandardMaterial({ color: 0x444455 })
            );
            plane.rotation.x = -Math.PI / 2;
            scene.add(plane);

            statusEl.innerText = "Running OK!";
            statusEl.style.color = "#55ff55";

            function animate() {
                requestAnimationFrame(animate);
                cube.rotation.y += 0.01;
                renderer.render(scene, camera);
            }
            animate();

        } catch (e) {
            errorBox.style.display = 'block';
            errorBox.innerText = "Catch Error: " + e.message + "\n" + e.stack;
            statusEl.innerText = "Crashed!";
            statusEl.style.color = "#ff5555";
        }
    </script>
</body>
</html>
