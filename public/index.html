<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Badabing - Town & Mansion</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #1a1a24; font-family: sans-serif; color: #fff; }
        #info { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; z-index: 10; }
        h1 { margin: 0 0 5px 0; font-size: 18px; color: #ff5555; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; transform: translate(-50%, -50%); border: 2px solid #fff; border-radius: 50%; pointer-events: none; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
      }
    </script>
</head>
<body>
    <div id="crosshair"></div>
    <div id="info">
        <h1>The Badabing 🦫</h1>
        <p>Click screen to look around | WASD to walk</p>
    </div>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87a8d0);
        scene.fog = new THREE.FogExp2(0x87a8d0, 0.005);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.8, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xfff6e5, 1.2);
        dirLight.position.set(50, 80, 50);
        scene.add(dirLight);

        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(300, 300),
            new THREE.MeshStandardMaterial({ color: 0x2d5a27 })
        );
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        const roadNS = new THREE.Mesh(
            new THREE.PlaneGeometry(16, 300),
            new THREE.MeshStandardMaterial({ color: 0x26292e })
        );
        roadNS.rotation.x = -Math.PI / 2;
        roadNS.position.y = 0.01;
        scene.add(roadNS);

        const mansion = new THREE.Mesh(
            new THREE.BoxGeometry(20, 8, 16),
            new THREE.MeshStandardMaterial({ color: 0x5c6f84 })
        );
        mansion.position.set(-30, 4, -20);
        scene.add(mansion);

        const apeCorp = new THREE.Mesh(
            new THREE.BoxGeometry(24, 9, 18),
            new THREE.MeshStandardMaterial({ color: 0x2a2e36 })
        );
        apeCorp.position.set(0, 4.5, -40);
        scene.add(apeCorp);

        const gorilla = new THREE.Mesh(
            new THREE.BoxGeometry(3, 4, 3),
            new THREE.MeshStandardMaterial({ color: 0x1b1c1e })
        );
        gorilla.position.set(0, 2, -28);
        scene.add(gorilla);

        const peanut = new THREE.Mesh(
            new THREE.SphereGeometry(0.5, 16, 16),
            new THREE.MeshStandardMaterial({ color: 0xff8c00 })
        );
        peanut.position.set(0, 0.5, -15);
        scene.add(peanut);

        let isLocked = false;
        let yaw = 0, pitch = 0;

        renderer.domElement.addEventListener('click', () => {
            renderer.domElement.requestPointerLock();
        });
        document.addEventListener('pointerlockchange', () => {
            isLocked = (document.pointerLockElement === renderer.domElement);
        });
        document.addEventListener('mousemove', (e) => {
            if (!isLocked) return;
            yaw -= e.movementX * 0.002;
            pitch -= e.movementY * 0.002;
            pitch = Math.max(-1.5, Math.min(1.5, pitch));
            camera.rotation.order = 'YXZ';
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;
        });

        const keys = { w: false, a: false, s: false, d: false };
        window.addEventListener('keydown', e => {
            if (e.key.toLowerCase() === 'w') keys.w = true;
            if (e.key.toLowerCase() === 's') keys.s = true;
            if (e.key.toLowerCase() === 'a') keys.a = true;
            if (e.key.toLowerCase() === 'd') keys.d = true;
        });
        window.addEventListener('keyup', e => {
            if (e.key.toLowerCase() === 'w') keys.w = false;
            if (e.key.toLowerCase() === 's') keys.s = false;
            if (e.key.toLowerCase() === 'a') keys.a = false;
            if (e.key.toLowerCase() === 'd') keys.d = false;
        });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);

            if (isLocked) {
                const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                const speed = 10;
                if (keys.w) camera.position.addScaledVector(forward, speed * delta);
                if (keys.s) camera.position.addScaledVector(forward, -speed * delta);
                if (keys.a) camera.position.addScaledVector(right, -speed * delta);
                if (keys.d) camera.position.addScaledVector(right, speed * delta);
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
