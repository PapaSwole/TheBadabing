<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Badabing - Full City & Roaming Peanut</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a24;
            font-family: sans-serif;
            color: #fff;
            user-select: none;
        }
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(20, 20, 28, 0.95);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            z-index: 10;
            width: 290px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        h1 { margin: 0 0 5px 0; font-size: 18px; color: #ff5555; }
        p { margin: 0 0 6px 0; font-size: 12px; color: #ccc; }
        #status { font-weight: bold; color: #ffaa00; }

        #god-mode-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(20, 20, 28, 0.95);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ff5555;
            z-index: 10;
            width: 240px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        #god-mode-panel h2 { margin: 0 0 10px 0; font-size: 15px; color: #ff5555; }
        .station-btn {
            display: block;
            width: 100%;
            padding: 9px;
            margin-bottom: 8px;
            background: #2a2a38;
            border: 1px solid #4a4a5e;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            text-align: left;
            font-size: 13px;
            transition: 0.2s;
        }
        .station-btn:hover { background: #ff5555; border-color: #ff5555; }
        .station-btn.active { background: #e63939; border-color: #fff; font-weight: bold; }
        #controls-hint {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(20, 20, 28, 0.9);
            padding: 12px 18px;
            border-radius: 6px;
            border: 1px solid #444;
            font-size: 12px;
            color: #ddd;
            z-index: 10;
            line-height: 1.5;
        }
        #controls-hint span { color: #ff5555; font-weight: bold; }
    </style>
</head>
<body>

    <div id="info-panel">
        <h1>The Badabing 🦫</h1>
        <p>Status: <span id="status">Connecting...</span></p>
        <p>Peanut's Position: <span id="coords">X: 0, Z: 0</span></p>
        <p>Cam Mode: <span id="cam-mode" style="color: #55ff55;">God Mode Free Orbit</span></p>
    </div>

    <div id="god-mode-panel">
        <h2>God Mode Base-Building</h2>
        <p>Select asset to spawn:</p>
        <button class="station-btn" data-type="workbench">🛠️ Industrial Workbench</button>
        <button class="station-btn" data-type="crate">📦 Storage Crate Stack</button>
        <button class="station-btn" data-type="bed">🛌 Recovery Pod</button>
        <button class="station-btn" data-type="none" style="background: #4a2222;">❌ Clear Selection</button>
    </div>

    <div id="controls-hint">
        Free Orbit / Pan: <span>Left/Right Click Drag</span> | Zoom: <span>Scroll</span><br>
        Toggle Follow Peanut: <span>Press 'C'</span> | Place/Delete: <span>Click Ground/Props</span>
    </div>

    <!-- Import Three.js via CDN -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const statusEl = document.getElementById('status');
        const coordsEl = document.getElementById('coords');

        try {
            console.log("🚀 Starting Three.js Scene Setup...");

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1e222a);
            scene.fog = new THREE.FogExp2(0x1e222a, 0.012);

            const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1500);
            camera.position.set(0, 35, 45);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.3;
            document.body.appendChild(renderer.domElement);

            const controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.05;
            controls.target.set(0, 0, 0);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xddeeff, 0.75);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfff8ee, 1.4);
            sunLight.position.set(45, 70, 35);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            scene.add(sunLight);

            // Ground
            const groundGeo = new THREE.PlaneGeometry(300, 300);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x2b2f38, roughness: 0.9 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Town Buildings
            const townGroup = new THREE.Group();
            scene.add(townGroup);

            const asphaltMat = new THREE.MeshStandardMaterial({ color: 0x242830, roughness: 0.85 });
            const concreteMat = new THREE.MeshStandardMaterial({ color: 0x545b6b, roughness: 0.75 });
            const brickRedMat = new THREE.MeshStandardMaterial({ color: 0x6e3b30, roughness: 0.8 });
            const brickDarkMat = new THREE.MeshStandardMaterial({ color: 0x423d42, roughness: 0.8 });
            const metalTrimMat = new THREE.MeshStandardMaterial({ color: 0x2e323b, metalness: 0.7, roughness: 0.4 });
            const windowGlassMat = new THREE.MeshStandardMaterial({ color: 0x1f3b4f, roughness: 0.1, metalness: 0.9, emissive: 0x112233, emissiveIntensity: 0.5 });
            const awningRed = new THREE.MeshStandardMaterial({ color: 0xb82e2e, roughness: 0.6 });
            const awningBlue = new THREE.MeshStandardMaterial({ color: 0x256cb3, roughness: 0.6 });
            const awningGreen = new THREE.MeshStandardMaterial({ color: 0x2e8540, roughness: 0.6 });

            // Roads
            const roadNS = new THREE.Mesh(new THREE.PlaneGeometry(16, 240), asphaltMat);
            roadNS.rotation.x = -Math.PI / 2;
            roadNS.position.set(0, 0.01, 0);
            townGroup.add(roadNS);

            const roadEW = new THREE.Mesh(new THREE.PlaneGeometry(240, 16), asphaltMat);
            roadEW.rotation.x = -Math.PI / 2;
            roadEW.position.set(0, 0.01, 0);
            townGroup.add(roadEW);

            function createBuilding(x, z, w, h, d, wallMat, awningMat) {
                const bld = new THREE.Group();
                const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
                body.position.set(0, h / 2, 0);
                body.castShadow = true;
                bld.add(body);

                const winWidth = w * 0.7;
                const winHeight = h * 0.35;
                const glass = new THREE.Mesh(new THREE.BoxGeometry(winWidth, winHeight, 0.1), windowGlassMat);
                glass.position.set(0, winHeight / 2 + 0.4, d / 2 + 0.03);
                bld.add(glass);

                if (awningMat) {
                    const awning = new THREE.Mesh(new THREE.BoxGeometry(w * 0.85, 0.35, 1.8), awningMat);
                    awning.position.set(0, winHeight + 0.9, d / 2 + 0.8);
                    awning.rotation.x = 0.25;
                    bld.add(awning);
                }

                bld.position.set(x, 0, z);
                townGroup.add(bld);
            }

            createBuilding(0, -35, 24, 9, 16, brickRedMat, awningRed);
            createBuilding(-35, -18, 18, 7.5, 16, brickDarkMat, awningBlue);
            createBuilding(35, -18, 20, 8, 16, concreteMat, awningGreen);
            createBuilding(-35, 18, 20, 7.5, 16, brickRedMat, awningRed);
            createBuilding(35, 18, 22, 9, 16, brickDarkMat, awningBlue);

            // Peanut Bird Model
            const peanutGroup = new THREE.Group();
            scene.add(peanutGroup);

            const featherMat = new THREE.MeshStandardMaterial({ color: 0xff8c00, roughness: 0.3 });
            const birdBody = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 16), featherMat);
            birdBody.scale.set(1, 0.8, 1.3);
            birdBody.position.y = 0.6;
            peanutGroup.add(birdBody);

            const birdHead = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), featherMat);
            birdHead.position.set(0, 0.95, 0.35);
            peanutGroup.add(birdHead);

            // WebSocket Connection
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}`;
            console.log("🔌 Connecting to:", wsUrl);

            const ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                console.log("✅ Connected!");
                statusEl.innerText = "Connected";
                statusEl.style.color = "#55ff55";
            };

            ws.onerror = (e) => {
                console.error("❌ WS Error:", e);
                statusEl.innerText = "Connection Error";
                statusEl.style.color = "#ff5555";
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                const birdData = data.bird || data.state?.bird;
                if (birdData) {
                    peanutGroup.position.x = birdData.x;
                    peanutGroup.position.z = birdData.z;
                    coordsEl.innerText = `X: ${birdData.x.toFixed(2)}, Z: ${birdData.z.toFixed(2)}`;
                }
            };

            // Animation Loop
            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }
            animate();

        } catch (err) {
            console.error("💥 Critical Script Error:", err);
            statusEl.innerText = "Script Error";
            statusEl.style.color = "#ff0000";
        }
    </script>
</body>
</html>
