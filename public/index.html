<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Badabing - Detailed Realistic Town</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a24;
            font-family: sans-serif;
            color: #fff;
            user-select: none;
        }
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(20, 20, 28, 0.95);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            pointer-events: auto;
            z-index: 10;
            width: 280px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        h1 { margin: 0 0 5px 0; font-size: 18px; color: #ff5555; letter-spacing: 0.5px; }
        p { margin: 0 0 6px 0; font-size: 12px; color: #ccc; }
        #status { font-weight: bold; color: #55ff55; }

        #god-mode-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(20, 20, 28, 0.95);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ff5555;
            z-index: 10;
            width: 240px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        #god-mode-panel h2 { margin: 0 0 10px 0; font-size: 15px; color: #ff5555; }
        .station-btn {
            display: block;
            width: 100%;
            padding: 9px;
            margin-bottom: 8px;
            background: #2a2a38;
            border: 1px solid #4a4a5e;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            text-align: left;
            font-size: 13px;
            transition: 0.2s;
        }
        .station-btn:hover { background: #ff5555; border-color: #ff5555; }
        .station-btn.active { background: #e63939; border-color: #fff; font-weight: bold; }
        #controls-hint {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(20, 20, 28, 0.9);
            padding: 12px 18px;
            border-radius: 6px;
            border: 1px solid #444;
            font-size: 12px;
            color: #ddd;
            pointer-events: none;
            z-index: 10;
        }
        #controls-hint span { color: #ff5555; font-weight: bold; }
    </style>
</head>
<body>

    <div id="info-panel">
        <h1>The Badabing 🦫</h1>
        <p>Status: <span id="status">Connecting...</span></p>
        <p>Peanut Coordinates: <span id="coords">X: 0, Z: 0</span></p>
        <p>Camera Mode: <span id="cam-mode" style="color: #55ff55;">Free Orbit</span> (Press 'C' to toggle)</p>
    </div>

    <div id="god-mode-panel">
        <h2>God Mode Base-Building</h2>
        <p>Select asset:</p>
        <button class="station-btn" data-type="workbench">🛠️ Industrial Workbench</button>
        <button class="station-btn" data-type="crate">📦 Storage Crate Stack</button>
        <button class="station-btn" data-type="bed">🛌 Recovery Pod</button>
        <button class="station-btn" data-type="none" style="background: #4a2222;">❌ Clear Selection</button>
    </div>

    <div id="controls-hint">
        Movement: <span>WASD / Arrows</span> | Look: <span>Mouse Drag</span> | Zoom: <span>Scroll</span> | Toggle Cam: <span>C</span>
    </div>

    <!-- Import Three.js via CDN -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. Scene, Camera, Renderer Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1e222a); // Brighter, atmospheric slate blue-grey
        scene.fog = new THREE.FogExp2(0x1e222a, 0.012);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1500);
        camera.position.set(0, 35, 45);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;
        controls.target.set(0, 0, 0);

        // 2. Realistic Daylight & Ambient Lighting
        const ambientLight = new THREE.AmbientLight(0xddeeff, 0.75); // Bright natural fill light
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfff8ee, 1.4); // Strong warm sunlight
        sunLight.position.set(45, 70, 35);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 4096;
        sunLight.shadow.mapSize.height = 4096;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 250;
        const d = 60;
        sunLight.shadow.camera.left = -d;
        sunLight.shadow.camera.right = d;
        sunLight.shadow.camera.top = d;
        sunLight.shadow.camera.bottom = -d;
        sunLight.shadow.bias = -0.0005;
        scene.add(sunLight);

        // 3. Detailed Architectural Town Generator
        const townGroup = new THREE.Group();
        scene.add(townGroup);

        // Ground & Sidewalks
        const groundGeo = new THREE.PlaneGeometry(300, 300);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x2b2f38, roughness: 0.9 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        function buildDetailedEnvironment() {
            const asphaltMat = new THREE.MeshStandardMaterial({ color: 0x242830, roughness: 0.85 });
            const concreteMat = new THREE.MeshStandardMaterial({ color: 0x545b6b, roughness: 0.75 });
            const brickRedMat = new THREE.MeshStandardMaterial({ color: 0x6e3b30, roughness: 0.8 });
            const brickDarkMat = new THREE.MeshStandardMaterial({ color: 0x423d42, roughness: 0.8 });
            const metalTrimMat = new THREE.MeshStandardMaterial({ color: 0x2e323b, metalness: 0.7, roughness: 0.4 });
            const windowGlassMat = new THREE.MeshStandardMaterial({ color: 0x1f3b4f, roughness: 0.1, metalness: 0.9, emissive: 0x112233, emissiveIntensity: 0.5 });
            const windowFrameMat = new THREE.MeshStandardMaterial({ color: 0x111115, roughness: 0.5 });
            const hvacMat = new THREE.MeshStandardMaterial({ color: 0x8a92a3, metalness: 0.8, roughness: 0.4 });
            
            const awningRed = new THREE.MeshStandardMaterial({ color: 0xb82e2e, roughness: 0.6 });
            const awningBlue = new THREE.MeshStandardMaterial({ color: 0x256cb3, roughness: 0.6 });
            const awningGreen = new THREE.MeshStandardMaterial({ color: 0x2e8540, roughness: 0.6 });

            // Roads
            const roadNS = new THREE.Mesh(new THREE.PlaneGeometry(16, 240), asphaltMat);
            roadNS.rotation.x = -Math.PI / 2;
            roadNS.position.set(0, 0.01, 0);
            roadNS.receiveShadow = true;
            townGroup.add(roadNS);

            const roadEW = new THREE.Mesh(new THREE.PlaneGeometry(240, 16), asphaltMat);
            roadEW.rotation.x = -Math.PI / 2;
            roadEW.position.set(0, 0.01, 0);
            roadEW.receiveShadow = true;
            townGroup.add(roadEW);

            // Sidewalk curbs
            const sw1 = new THREE.Mesh(new THREE.PlaneGeometry(3.5, 240), concreteMat);
            sw1.rotation.x = -Math.PI / 2;
            sw1.position.set(-9.75, 0.02, 0);
            sw1.receiveShadow = true;
            townGroup.add(sw1);

            const sw2 = new THREE.Mesh(new THREE.PlaneGeometry(3.5, 240), concreteMat);
            sw2.rotation.x = -Math.PI / 2;
            sw2.position.set(9.75, 0.02, 0);
            sw2.receiveShadow = true;
            townGroup.add(sw2);

            // Function to build highly detailed modular buildings
            function createBuilding(x, z, w, h, d, wallMat, storeName, awningMat) {
                const bld = new THREE.Group();

                // Main Wall Body
                const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
                body.position.set(0, h / 2, 0);
                body.castShadow = true;
                body.receiveShadow = true;
                bld.add(body);

                // Recessed Storefront Glass & Frame
                const winWidth = w * 0.7;
                const winHeight = h * 0.35;
                const glass = new THREE.Mesh(new THREE.BoxGeometry(winWidth, winHeight, 0.1), windowGlassMat);
                glass.position.set(0, winHeight / 2 + 0.4, d / 2 + 0.03);
                bld.add(glass);

                // Window Pane Grid Mullions (Adds realism)
                for (let i = -1; i <= 1; i += 2) {
                    const mullion = new THREE.Mesh(new THREE.BoxGeometry(0.06, winHeight, 0.15), windowFrameMat);
                    mullion.position.set(i * (winWidth / 4), winHeight / 2 + 0.4, d / 2 + 0.04);
                    bld.add(mullion);
                }

                // Fabric Awning over storefront
                if (awningMat) {
                    const awning = new THREE.Mesh(new THREE.BoxGeometry(w * 0.85, 0.35, 1.8), awningMat);
                    awning.position.set(0, winHeight + 0.9, d / 2 + 0.8);
                    awning.rotation.x = 0.25;
                    awning.castShadow = true;
                    bld.add(awning);
                }

                // Roof Parapet / Cornice Trim
                const cornice = new THREE.Mesh(new THREE.BoxGeometry(w + 0.6, 0.6, d + 0.6), metalTrimMat);
                cornice.position.set(0, h + 0.3, 0);
                cornice.castShadow = true;
                bld.add(cornice);

                // Rooftop HVAC / Ventilation Units (Adds mechanical grit)
                const hvacCount = Math.floor(w / 6) + 1;
                for (let i = 0; i < hvacCount; i++) {
                    const hvac = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.0, 1.4), hvacMat);
                    hvac.position.set(-w / 4 + i * 2.2, h + 0.85, (Math.random() - 0.5) * (d / 2));
                    hvac.castShadow = true;
                    bld.add(hvac);
                }

                bld.position.set(x, 0, z);
                townGroup.add(bld);
            }

            // Build distinct, detailed storefronts around the intersection
            createBuilding(0, -35, 24, 9, 16, brickRedMat, "The Badabing HQ", awningRed);
            createBuilding(-35, -18, 18, 7.5, 16, brickDarkMat, "Supply Depot", awningBlue);
            createBuilding(35, -18, 20, 8, 16, concreteMat, "Corner Bodega", awningGreen);
            createBuilding(-35, 18, 20, 7.5, 16, brickRedMat, "Hardware Exchange", awningRed);
            createBuilding(35, 18, 22, 9, 16, brickDarkMat, "Safehouse Arms", awningBlue);
        }

        buildDetailedEnvironment();

        // 4. Peanut (The Bird Representation)
        const peanutGeo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
        const peanutMat = new THREE.MeshStandardMaterial({ color: 0xffaa00, roughness: 0.2, metalness: 0.3 });
        const peanutMesh = new THREE.Mesh(peanutGeo, peanutMat);
        peanutMesh.position.y = 0.6;
        peanutMesh.castShadow = true;
        scene.add(peanutMesh);

        // Stations Group
        const stationsGroup = new THREE.Group();
        scene.add(stationsGroup);

        // --- DETAILED MODULAR PROP BUILDERS ---
        function createWorkbenchModel() {
            const group = new THREE.Group();
            const frameMat = new THREE.MeshStandardMaterial({ color: 0x1e1e26, metalness: 0.8, roughness: 0.3 });
            const topMat = new THREE.MeshStandardMaterial({ color: 0x7c471b, roughness: 0.6 });
            const screenMat = new THREE.MeshStandardMaterial({ color: 0x111111, emissive: 0x0055ff, emissiveIntensity: 0.8 });

            const legGeo = new THREE.BoxGeometry(0.12, 0.9, 0.12);
            [-0.5, 0.5].forEach(x => {
                [-0.3, 0.3].forEach(z => {
                    const leg = new THREE.Mesh(legGeo, frameMat);
                    leg.position.set(x, 0.45, z);
                    leg.castShadow = true;
                    group.add(leg);
                });
            });

            const top = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.1, 0.85), topMat);
            top.position.set(0, 0.95, 0);
            top.castShadow = true;
            top.receiveShadow = true;
            group.add(top);

            const monitor = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.4, 0.1), screenMat);
            monitor.position.set(0, 1.3, -0.3);
            monitor.castShadow = true;
            group.add(monitor);

            return group;
        }

        function createCrateModel() {
            const group = new THREE.Group();
            const crateMat = new THREE.MeshStandardMaterial({ color: 0xbd7d4b, roughness: 0.85 });
            const bandMat = new THREE.MeshStandardMaterial({ color: 0x2a2a33, metalness: 0.7, roughness: 0.4 });

            [0.35, 1.05].forEach((y, i) => {
                const size = i === 0 ? 0.85 : 0.65;
                const crate = new THREE.Mesh(new THREE.BoxGeometry(size, size, size), crateMat);
                crate.position.set((i * 0.1), y, (i * -0.05));
                crate.castShadow = true;
                crate.receiveShadow = true;
                group.add(crate);

                const band = new THREE.Mesh(new THREE.BoxGeometry(size + 0.02, 0.08, size + 0.02), bandMat);
                band.position.set((i * 0.1), y, (i * -0.05));
                group.add(band);
            });

            return group;
        }

        function createBedModel() {
            const group = new THREE.Group();
            const frameMat = new THREE.MeshStandardMaterial({ color: 0x2a2a35, metalness: 0.6, roughness: 0.4 });
            const mattressMat = new THREE.MeshStandardMaterial({ color: 0x1b4d3e, roughness: 0.9 });
            const pillowMat = new THREE.MeshStandardMaterial({ color: 0xe8e8e8, roughness: 0.9 });

            const frame = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.3, 1.9), frameMat);
            frame.position.set(0, 0.15, 0);
            frame.castShadow = true;
            group.add(frame);

            const mattress = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.25, 1.8), mattressMat);
            mattress.position.set(0, 0.35, 0);
            mattress.castShadow = true;
            group.add(mattress);

            const pillow = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.12, 0.35), pillowMat);
            pillow.position.set(0, 0.5, -0.65);
            pillow.castShadow = true;
            group.add(pillow);

            return group;
        }

        // 5. WebSocket Connection & State
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}`;
        const ws = new WebSocket(wsUrl);

        const statusEl = document.getElementById('status');
        const coordsEl = document.getElementById('coords');

        ws.onopen = () => {
            statusEl.innerText = "Connected to Detailed Town";
            statusEl.style.color = "#55ff55";
        };

        ws.onclose = () => {
            statusEl.innerText = "Disconnected";
            statusEl.style.color = "#ff5555";
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'init_world') {
                updateStations(data.stations);
                if (data.state?.bird) updateBird(data.state.bird);
            }
            if (data.type === 'world:stations_updated') {
                updateStations(data.stations);
            }
            if (data.type === 'bird:position') {
                updateBird(data.bird);
            }
        };

        function updateBird(bird) {
            peanutMesh.position.x = bird.x;
            peanutMesh.position.z = bird.z;
            coordsEl.innerText = `X: ${bird.x.toFixed(2)}, Z: ${bird.z.toFixed(2)}`;
        }

        function updateStations(stations) {
            while(stationsGroup.children.length > 0){ 
                stationsGroup.remove(stationsGroup.children[0]); 
            }
            stations.forEach(st => {
                let model;
                if (st.type === 'workbench') model = createWorkbenchModel();
                else if (st.type === 'crate') model = createCrateModel();
                else if (st.type === 'bed') model = createBedModel();
                else model = createWorkbenchModel();

                model.position.set(st.gridX, 0, st.gridZ);
                model.userData = { uid: st.uid };
                stationsGroup.add(model);
            });
        }

        // 6. Movement System (WASD / Keyboard Navigation)
        const moveState = { forward: false, backward: false, left: false, right: false };
        const moveSpeed = 0.45;
        let followCamMode = false;

        window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') moveState.forward = true;
            if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') moveState.backward = true;
            if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') moveState.left = true;
            if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') moveState.right = true;
            if (e.key === 'c' || e.key === 'C') {
                followCamMode = !followCamMode;
                document.getElementById('cam-mode').innerText = followCamMode ? "Peanut Follow Cam" : "Free Orbit";
                document.getElementById('cam-mode').style.color = followCamMode ? "#ffaa00" : "#55ff55";
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') moveState.forward = false;
            if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') moveState.backward = false;
            if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') moveState.left = false;
            if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') moveState.right = false;
        });

        // 7. God Mode Placement Logic
        let selectedTool = null;
        document.querySelectorAll('.station-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.station-btn').forEach(b => b.classList.remove('active'));
                const type = e.target.getAttribute('data-type');
                if (type === 'none') {
                    selectedTool = null;
                } else {
                    selectedTool = type;
                    e.target.classList.add('active');
                }
            });
        });

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (event) => {
            if (event.clientX > window.innerWidth - 260 && event.clientY < 240) return;
            if (event.clientX < 300 && event.clientY < 180) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            const intersectsStations = raycaster.intersectObjects(stationsGroup.children, true);
            if (intersectsStations.length > 0) {
                if (!selectedTool) {
                    let rootObj = intersectsStations[0].object;
                    while (rootObj.parent && rootObj.parent !== stationsGroup) {
                        rootObj = rootObj.parent;
                    }
                    const hitUid = rootObj.userData.uid;
                    if (hitUid) {
                        ws.send(JSON.stringify({ type: 'admin:delete_station', uid: hitUid }));
                    }
                    return;
                }
            }

            if (selectedTool) {
                const intersectsGround = raycaster.intersectObject(ground);
                if (intersectsGround.length > 0) {
                    const point = intersectsGround[0].point;
                    const gridX = Math.round(point.x);
                    const gridZ = Math.round(point.z);
                    const uid = `station_${Date.now()}_${Math.floor(Math.random()*1000)}`

                    const newStation = {
                        uid,
                        type: selectedTool,
                        gridX,
                        gridZ,
                        rotation: 0,
                        footprintX: 1,
                        footprintZ: 1
                    };
                    ws.send(JSON.stringify({ type: 'admin:place_station', station: newStation }));
                }
            }
        });

        // 8. Animation & Camera Loop
        function animate() {
            requestAnimationFrame(animate);

            if (moveState.forward) camera.position.z -= moveSpeed;
            if (moveState.backward) camera.position.z += moveSpeed;
            if (moveState.left) camera.position.x -= moveSpeed;
            if (moveState.right) camera.position.x += moveSpeed;

            if (followCamMode) {
                controls.enabled = false;
                camera.position.x = THREE.MathUtils.lerp(camera.position.x, peanutMesh.position.x, 0.1);
                camera.position.z = THREE.MathUtils.lerp(camera.position.z, peanutMesh.position.z + 12, 0.1);
                camera.position.y = THREE.MathUtils.lerp(camera.position.y, 8, 0.1);
                camera.lookAt(peanutMesh.position);
            } else {
                controls.enabled = true;
                controls.update();
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
