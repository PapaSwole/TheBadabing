<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Badabing - Self-Contained 3D World</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a24;
            font-family: sans-serif;
            color: #fff;
            user-select: none;
        }
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(20, 20, 28, 0.95);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            z-index: 10;
            width: 290px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        h1 { margin: 0 0 5px 0; font-size: 18px; color: #ff5555; }
        p { margin: 0 0 6px 0; font-size: 12px; color: #ccc; }
        #status { font-weight: bold; color: #55ff55; }

        #god-mode-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(20, 20, 28, 0.95);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #00aaff;
            z-index: 10;
            width: 240px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        #god-mode-panel h2 { margin: 0 0 10px 0; font-size: 15px; color: #00aaff; }
        .station-btn {
            display: block;
            width: 100%;
            padding: 9px;
            margin-bottom: 8px;
            background: #2a2a38;
            border: 1px solid #4a4a5e;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            text-align: left;
            font-size: 13px;
            transition: 0.2s;
        }
        .station-btn:hover { background: #00aaff; border-color: #00aaff; }
        .station-btn.active { background: #0088cc; border-color: #fff; font-weight: bold; }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
        }
        #controls-hint {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(20, 20, 28, 0.9);
            padding: 12px 18px;
            border-radius: 6px;
            border: 1px solid #444;
            font-size: 12px;
            color: #ddd;
            z-index: 10;
            line-height: 1.5;
        }
        #controls-hint span { color: #00aaff; font-weight: bold; }
    </style>

    <!-- Reliable Three.js CDN Bundle -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="crosshair"></div>

    <div id="info-panel">
        <h1>The Badabing 🦫</h1>
        <p>Status: <span id="status">Active (Standalone)</span></p>
        <p>Peanut's Pos: <span id="coords">X: 0, Z: 0</span></p>
        <p>Cam Mode: <span id="cam-mode" style="color: #00aaff;">1st-Person Walkthrough</span></p>
    </div>

    <div id="god-mode-panel">
        <h2>Admin Builder Tools</h2>
        <p>Select tool to place:</p>
        <button class="station-btn" data-type="workbench">🛠️ Industrial Workbench</button>
        <button class="station-btn" data-type="crate">📦 Storage Crate Stack</button>
        <button class="station-btn" data-type="none" style="background: #333;">✋ Hands Empty</button>
    </div>

    <div id="controls-hint">
        Look Around: <span>Mouse Drag</span> | Walk: <span>WASD</span><br>
        Place Prop: <span>Left Click on Ground</span>
    </div>

    <script>
        try {
            console.log("🚀 Initializing Self-Contained 3D World...");

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87a8d0);
            scene.fog = new THREE.FogExp2(0x87a8d0, 0.003);

            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3, 25);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Lighting
            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const sunLight = new THREE.DirectionalLight(0xfff6e5, 1.2);
            sunLight.position.set(40, 80, 40);
            sunLight.castShadow = true;
            scene.add(sunLight);

            // Ground (Grass)
            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(300, 300),
                new THREE.MeshStandardMaterial({ color: 0x2d5a27, roughness: 0.9 })
            );
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Roads
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x26292e, roughness: 0.8 });
            const roadNS = new THREE.Mesh(new THREE.PlaneGeometry(16, 250), roadMat);
            roadNS.rotation.x = -Math.PI / 2;
            roadNS.position.set(0, 0.02, 0);
            scene.add(roadNS);

            const roadEW = new THREE.Mesh(new THREE.PlaneGeometry(250, 16), roadMat);
            roadEW.rotation.x = -Math.PI / 2;
            roadEW.position.set(0, 0.03, 0);
            scene.add(roadEW);

            // Buildings
            const buildingMat = new THREE.MeshStandardMaterial({ color: 0x8f3b2e, roughness: 0.85 });
            function createBuilding(x, z, w, h, d) {
                const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), buildingMat);
                body.position.set(x, h / 2, z);
                body.castShadow = true;
                body.receiveShadow = true;
                scene.add(body);
            }
            createBuilding(0, -35, 24, 10, 16);
            createBuilding(35, 0, 20, 9, 16);
            createBuilding(-35, 0, 20, 9, 16);
            createBuilding(0, 35, 22, 10, 16);

            // Peanut the Bird with Animated Eyes
            const peanutGroup = new THREE.Group();
            scene.add(peanutGroup);

            const featherMat = new THREE.MeshStandardMaterial({ color: 0xff8c00 });
            const beakMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b });

            const birdBody = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 16), featherMat);
            birdBody.scale.set(1, 0.8, 1.3);
            birdBody.position.y = 0.6;
            birdBody.castShadow = true;
            peanutGroup.add(birdBody);

            const birdHead = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), featherMat);
            birdHead.position.set(0, 1.0, 0.3);
            peanutGroup.add(birdHead);

            const birdBeak = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.35, 8), beakMat);
            birdBeak.rotateX(Math.PI / 2);
            birdBeak.position.set(0, 0.95, 0.62);
            peanutGroup.add(birdBeak);

            // Animated Eyes
            const eyeGroup = new THREE.Group();
            peanutGroup.add(eyeGroup);

            const eyeballMat = new THREE.MeshBasicMaterial({ color: 0x050505 });
            const pupilMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

            const leftEye = new THREE.Group();
            leftEye.position.set(-0.13, 1.05, 0.52);
            leftEye.add(new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), eyeballMat));
            const lPupil = new THREE.Mesh(new THREE.SphereGeometry(0.03, 8, 8), pupilMat);
            lPupil.position.set(0.02, 0.02, 0.05);
            leftEye.add(lPupil);

            const rightEye = new THREE.Group();
            rightEye.position.set(0.13, 1.05, 0.52);
            rightEye.add(new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), eyeballMat));
            const rPupil = new THREE.Mesh(new THREE.SphereGeometry(0.03, 8, 8), pupilMat);
            rPupil.position.set(-0.02, 0.02, 0.05);
            rightEye.add(rPupil);

            eyeGroup.add(leftEye, rightEye);

            // Props group
            const propsGroup = new THREE.Group();
            scene.add(propsGroup);

            // Simple Mouse Look & WASD Movement Controls
            let isMouseDown = false;
            let mouseX = 0, mouseY = 0;
            let cameraRotationY = 0, cameraRotationX = 0;

            window.addEventListener('mousedown', () => { isMouseDown = true; });
            window.addEventListener('mouseup', () => { isMouseDown = false; });
            window.addEventListener('mousemove', (e) => {
                if (!isMouseDown) return;
                const deltaX = e.movementX || e.clientX - mouseX;
                const deltaY = e.movementY || e.clientY - mouseY;
                cameraRotationY -= deltaX * 0.003;
                cameraRotationX -= deltaY * 0.003;
                cameraRotationX = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, cameraRotationX));
                mouseX = e.clientX;
                mouseY = e.clientY;
            });

            let selectedTool = null;
            document.querySelectorAll('.station-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.station-btn').forEach(b => b.classList.remove('active'));
                    const type = e.currentTarget.getAttribute('data-type');
                    selectedTool = (type === 'none') ? null : type;
                    if (selectedTool) e.currentTarget.classList.add('active');
                });
            });

            window.addEventListener('click', (e) => {
                if (e.clientX > window.innerWidth - 260 && e.clientY < 240) return; // Ignore UI clicks
                if (selectedTool) {
                    const propMat = new THREE.MeshStandardMaterial({ color: selectedTool === 'workbench' ? 0x7c471b : 0xbd7d4b });
                    const prop = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.8, 1.2), propMat);
                    // Place 5 units in front of camera
                    prop.position.set(
                        camera.position.x - Math.sin(cameraRotationY) * 5,
                        0.4,
                        camera.position.z - Math.cos(cameraRotationY) * 5
                    );
                    prop.castShadow = true;
                    propsGroup.add(prop);
                }
            });

            const keys = { w: false, a: false, s: false, d: false };
            window.addEventListener('keydown', (e) => {
                const k = e.key.toLowerCase();
                if (k === 'w') keys.w = true;
                if (k === 's') keys.s = true;
                if (k === 'a') keys.a = true;
                if (k === 'd') keys.d = true;
            });
            window.addEventListener('keyup', (e) => {
                const k = e.key.toLowerCase();
                if (k === 'w') keys.w = false;
                if (k === 's') keys.s = false;
                if (k === 'a') keys.a = false;
                if (k === 'd') keys.d = false;
            });

            const clock = new THREE.Clock();

            function animate() {
                requestAnimationFrame(animate);
                const delta = clock.getDelta();
                const elapsed = clock.getElapsedTime();

                // Peanut wandering & blinking
                peanutGroup.position.y = Math.abs(Math.sin(elapsed * 10)) * 0.15;
                peanutGroup.position.x = Math.sin(elapsed * 0.5) * 12;
                peanutGroup.position.z = Math.cos(elapsed * 0.4) * 12;

                const blinkTimer = elapsed % 3.5;
                if (blinkTimer < 0.12) {
                    eyeGroup.scale.y = 0.1;
                } else {
                    eyeGroup.scale.y = 1.0;
                }
                document.getElementById('coords').innerText = `X: ${peanutGroup.position.x.toFixed(1)}, Z: ${peanutGroup.position.z.toFixed(1)}`;

                // WASD Camera movement
                const moveSpeed = 15.0 * delta;
                if (keys.w) {
                    camera.position.x -= Math.sin(cameraRotationY) * moveSpeed;
                    camera.position.z -= Math.cos(cameraRotationY) * moveSpeed;
                }
                if (keys.s) {
                    camera.position.x += Math.sin(cameraRotationY) * moveSpeed;
                    camera.position.z += Math.cos(cameraRotationY) * moveSpeed;
                }
                if (keys.a) {
                    camera.position.x -= Math.cos(cameraRotationY) * moveSpeed;
                    camera.position.z += Math.sin(cameraRotationY) * moveSpeed;
                }
                if (keys.d) {
                    camera.position.x += Math.cos(cameraRotationY) * moveSpeed;
                    camera.position.z -= Math.sin(cameraRotationY) * moveSpeed;
                }

                // Apply camera rotation
                const targetLook = new THREE.Vector3(
                    camera.position.x - Math.sin(cameraRotationY),
                    camera.position.y + Math.sin(cameraRotationX),
                    camera.position.z - Math.cos(cameraRotationY)
                );
                camera.lookAt(targetLook);

                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

        } catch (err) {
            console.error("💥 Critical Setup Error:", err);
            document.getElementById('status').innerText = "Script Error: " + err.message;
            document.getElementById('status').style.color = "#ff5555";
        }
    </script>
</body>
</html>
