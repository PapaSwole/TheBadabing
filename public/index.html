<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Badabing - Doubled Town Size</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a24;
            font-family: sans-serif;
            color: #fff;
            user-select: none;
        }
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(20, 20, 28, 0.95);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            z-index: 10;
            width: 290px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        h1 { margin: 0 0 5px 0; font-size: 18px; color: #ff5555; }
        p { margin: 0 0 6px 0; font-size: 12px; color: #ccc; }
        #status { font-weight: bold; color: #55ff55; }

        #god-mode-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(20, 20, 28, 0.95);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #00aaff;
            z-index: 10;
            width: 240px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        #god-mode-panel h2 { margin: 0 0 10px 0; font-size: 15px; color: #00aaff; }
        .station-btn {
            display: block;
            width: 100%;
            padding: 9px;
            margin-bottom: 8px;
            background: #2a2a38;
            border: 1px solid #4a4a5e;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            text-align: left;
            font-size: 13px;
            transition: 0.2s;
        }
        .station-btn:hover { background: #00aaff; border-color: #00aaff; }
        .station-btn.active { background: #0088cc; border-color: #fff; font-weight: bold; }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
        }
        #controls-hint {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(20, 20, 28, 0.9);
            padding: 12px 18px;
            border-radius: 6px;
            border: 1px solid #444;
            font-size: 12px;
            color: #ddd;
            z-index: 10;
            line-height: 1.5;
        }
        #controls-hint span { color: #00aaff; font-weight: bold; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

    <div id="crosshair"></div>

    <div id="info-panel">
        <h1>The Badabing 🦫</h1>
        <p>Status: <span id="status">Active (Doubled Town)</span></p>
        <p>Peanut's Pos: <span id="coords">X: 0, Z: 0</span></p>
        <p>Cam Mode: <span id="cam-mode" style="color: #00aaff;">1st-Person God Mode</span></p>
    </div>

    <div id="god-mode-panel">
        <h2>Admin Builder Tools</h2>
        <p>Select item to place / delete:</p>
        <button class="station-btn" data-type="workbench">🛠️ Industrial Workbench</button>
        <button class="station-btn" data-type="crate">📦 Storage Crate Stack</button>
        <button class="station-btn" data-type="bed">🛌 Recovery Pod</button>
        <button class="station-btn" data-type="delete" style="background: #5a2e2e;">🗑️ Delete Mode</button>
        <button class="station-btn" data-type="none" style="background: #333;">✋ Hands Empty (Look)</button>
    </div>

    <div id="controls-hint">
        Click Screen: <span>Lock Mouse Look</span> | Walk: <span>WASD</span><br>
        Fly Up/Down: <span>Space / Shift</span> | Release Mouse: <span>ESC</span>
    </div>

    <script>
        try {
            console.log("🚀 Initializing Doubled-Size Town World...");

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87a8d0);
            scene.fog = new THREE.FogExp2(0x87a8d0, 0.0025); // Adjusted fog for larger town scale

            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.set(0, 3, 20);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Lighting
            scene.add(new THREE.AmbientLight(0xffffff, 0.75));
            const sunLight = new THREE.DirectionalLight(0xfff6e5, 1.4);
            sunLight.position.set(80, 140, 80);
            sunLight.castShadow = true;
            scene.add(sunLight);

            // Larger Ground & Extended Roads
            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(700, 700),
                new THREE.MeshStandardMaterial({ color: 0x2d5a27, roughness: 0.9 })
            );
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            const roadMat = new THREE.MeshStandardMaterial({ color: 0x26292e, roughness: 0.8 });
            
            // Extended street grid
            [-160, -80, 0, 80, 160].forEach(pos => {
                const roadNS = new THREE.Mesh(new THREE.PlaneGeometry(16, 600), roadMat);
                roadNS.rotation.x = -Math.PI / 2;
                roadNS.position.set(pos, 0.02, 0);
                scene.add(roadNS);

                const roadEW = new THREE.Mesh(new THREE.PlaneGeometry(600, 16), roadMat);
                roadEW.rotation.x = -Math.PI / 2;
                roadEW.position.set(0, 0.03, pos);
                scene.add(roadEW);
            });

            // Storefront Buildings & Variants
            const buildingMat = new THREE.MeshStandardMaterial({ color: 0x8f3b2e, roughness: 0.85 });
            const brownBuildingMat = new THREE.MeshStandardMaterial({ color: 0x5e4c42, roughness: 0.85 });
            const greyBuildingMat = new THREE.MeshStandardMaterial({ color: 0x505c62, roughness: 0.8 });
            const metalTrimMat = new THREE.MeshStandardMaterial({ color: 0x333840, metalness: 0.6 });
            const windowGlassMat = new THREE.MeshStandardMaterial({ color: 0x1c3545, metalness: 0.85, roughness: 0.1 });
            const awningRed = new THREE.MeshStandardMaterial({ color: 0xb82e2e });
            const awningBlue = new THREE.MeshStandardMaterial({ color: 0x256cb3 });
            const awningGreen = new THREE.MeshStandardMaterial({ color: 0x2e8540 });

            function createBuilding(x, z, w, h, d, wallMat, awningMat) {
                const bld = new THREE.Group();
                const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
                body.position.set(0, h / 2, 0);
                body.castShadow = true;
                body.receiveShadow = true;
                bld.add(body);

                const cornice = new THREE.Mesh(new THREE.BoxGeometry(w + 0.5, 0.55, d + 0.5), metalTrimMat);
                cornice.position.set(0, h + 0.25, 0);
                bld.add(cornice);

                const glass = new THREE.Mesh(new THREE.BoxGeometry(w * 0.5, h * 0.35, 0.12), windowGlassMat);
                glass.position.set(-w * 0.12, h * 0.35, d / 2 + 0.03);
                bld.add(glass);

                const door = new THREE.Mesh(new THREE.BoxGeometry(w * 0.16, h * 0.38, 0.12), windowGlassMat);
                door.position.set(w * 0.28, (h * 0.38) / 2, d / 2 + 0.03);
                bld.add(door);

                if (awningMat) {
                    const awning = new THREE.Mesh(new THREE.BoxGeometry(w * 0.85, 0.35, 1.9), awningMat);
                    awning.position.set(0, h * 0.35 + 0.8, d / 2 + 0.85);
                    awning.rotation.x = 0.25;
                    bld.add(awning);
                }

                bld.position.set(x, 0, z);
                scene.add(bld);
            }

            // Populate buildings across the doubled grid blocks
            const blockPositions = [-120, -40, 40, 120];
            for (let xi of blockPositions) {
                for (let zi of blockPositions) {
                    if (Math.abs(xi) < 25 && Math.abs(zi) < 25) continue; // Keep center clear

                    createBuilding(xi - 25, zi - 45, 22, 10, 16, buildingMat, awningRed);
                    createBuilding(xi + 25, zi + 45, 20, 9, 16, brownBuildingMat, awningGreen);
                    createBuilding(xi - 45, zi + 25, 18, 11, 20, greyBuildingMat, awningBlue);
                }
            }

            // Peanut's Accessible 2-Story House
            function createPeanutHouse(x, z) {
                const house = new THREE.Group();
                const sidingMat = new THREE.MeshStandardMaterial({ color: 0x687685, roughness: 0.75 });
                const woodFloorMat = new THREE.MeshStandardMaterial({ color: 0x7c5230, roughness: 0.55 });
                const roofMat = new THREE.MeshStandardMaterial({ color: 0x26292e, roughness: 0.8 });
                const fenceMat = new THREE.MeshStandardMaterial({ color: 0x5c3a1e, roughness: 0.85 });

                function addWall(w, h, d, px, py, pz, mat) {
                    const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
                    wall.position.set(px, py, pz);
                    wall.castShadow = true;
                    house.add(wall);
                }

                addWall(16, 0.2, 12, 0, 0.1, 0, woodFloorMat);
                addWall(16, 0.2, 12, 0, 4.1, 0, woodFloorMat);
                addWall(17, 0.6, 13, 0, 8.3, 0, roofMat);

                addWall(0.5, 4, 12, -7.75, 2.1, 0, sidingMat);
                addWall(0.5, 4, 12, 7.75, 2.1, 0, sidingMat);
                addWall(16, 4, 0.5, 0, 2.1, -5.75, sidingMat);
                addWall(4, 4, 0.5, 5.75, 2.1, 5.75, sidingMat);
                addWall(2, 4, 0.5, 0.5, 2.1, 5.75, sidingMat);

                addWall(0.5, 4, 12, -7.75, 6.2, 0, sidingMat);
                addWall(0.5, 4, 12, 7.75, 6.2, 0, sidingMat);
                addWall(16, 4, 0.5, 0, 6.2, -5.75, sidingMat);
                addWall(16, 4, 0.5, 0, 6.2, 5.75, sidingMat);

                addWall(0.25, 2.2, 16, -7.9, 1.1, -14, fenceMat);
                addWall(0.25, 2.2, 16, 7.9, 1.1, -14, fenceMat);
                addWall(16, 2.2, 0.25, 0, 1.1, -21.9, fenceMat);

                house.position.set(x, 0, z);
                scene.add(house);
            }
            createPeanutHouse(-100, -100);

            // Peanut the Bird with Animated Eyes
            const peanutGroup = new THREE.Group();
            scene.add(peanutGroup);

            const featherMat = new THREE.MeshStandardMaterial({ color: 0xff8c00 });
            const beakMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b });

            const birdBody = new THREE.Mesh(new THREE.SphereGeometry(0.6, 16, 16), featherMat);
            birdBody.scale.set(1, 0.8, 1.3);
            birdBody.position.y = 0.6;
            birdBody.castShadow = true;
            peanutGroup.add(birdBody);

            const birdHead = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), featherMat);
            birdHead.position.set(0, 1.1, 0.3);
            peanutGroup.add(birdHead);

            const birdBeak = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.4, 8), beakMat);
            birdBeak.rotateX(Math.PI / 2);
            birdBeak.position.set(0, 1.05, 0.7);
            peanutGroup.add(birdBeak);

            // Animated Eyes
            const eyeGroup = new THREE.Group();
            peanutGroup.add(eyeGroup);

            const eyeballMat = new THREE.MeshBasicMaterial({ color: 0x050505 });
            const pupilMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

            const leftEye = new THREE.Group();
            leftEye.position.set(-0.16, 1.18, 0.58);
            leftEye.add(new THREE.Mesh(new THREE.SphereGeometry(0.09, 16, 16), eyeballMat));
            const lPupil = new THREE.Mesh(new THREE.SphereGeometry(0.035, 8, 8), pupilMat);
            lPupil.position.set(0.02, 0.02, 0.06);
            leftEye.add(lPupil);

            const rightEye = new THREE.Group();
            rightEye.position.set(0.16, 1.18, 0.58);
            rightEye.add(new THREE.Mesh(new THREE.SphereGeometry(0.09, 16, 16), eyeballMat));
            const rPupil = new THREE.Mesh(new THREE.SphereGeometry(0.035, 8, 8), pupilMat);
            rPupil.position.set(-0.02, 0.02, 0.06);
            rightEye.add(rPupil);

            eyeGroup.add(leftEye, rightEye);

            // God Mode Props Group
            const propsGroup = new THREE.Group();
            scene.add(propsGroup);

            // Controls & Mouse Look
            const controls = new THREE.PointerLockControls(camera, document.body);

            document.body.addEventListener('click', (e) => {
                if (e.clientX > window.innerWidth - 260 && e.clientY < 260) return;
                if (!controls.isLocked) {
                    controls.lock();
                } else if (selectedTool) {
                    const raycaster = new THREE.Raycaster();
                    raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

                    if (selectedTool === 'delete') {
                        const hits = raycaster.intersectObjects(propsGroup.children, true);
                        if (hits.length > 0) {
                            propsGroup.remove(hits[0].object);
                        }
                    } else {
                        const hits = raycaster.intersectObject(ground);
                        if (hits.length > 0) {
                            const pt = hits[0].point;
                            let propGeo, propMat;
                            if (selectedTool === 'workbench') {
                                propGeo = new THREE.BoxGeometry(1.5, 1, 0.8);
                                propMat = new THREE.MeshStandardMaterial({ color: 0x7c471b });
                            } else if (selectedTool === 'crate') {
                                propGeo = new THREE.BoxGeometry(0.9, 0.9, 0.9);
                                propMat = new THREE.MeshStandardMaterial({ color: 0xbd7d4b });
                            } else {
                                propGeo = new THREE.BoxGeometry(1.2, 0.4, 2);
                                propMat = new THREE.MeshStandardMaterial({ color: 0x1b4d3e });
                            }
                            const prop = new THREE.Mesh(propGeo, propMat);
                            prop.position.set(Math.round(pt.x), 0.5, Math.round(pt.z));
                            prop.castShadow = true;
                            propsGroup.add(prop);
                        }
                    }
                }
            });

            let selectedTool = null;
            document.querySelectorAll('.station-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.station-btn').forEach(b => b.classList.remove('active'));
                    const type = e.currentTarget.getAttribute('data-type');
                    selectedTool = (type === 'none') ? null : type;
                    if (selectedTool) e.currentTarget.classList.add('active');
                });
            });

            const keys = { w: false, a: false, s: false, d: false, space: false, shift: false };
            window.addEventListener('keydown', (e) => {
                const k = e.key.toLowerCase();
                if (k === 'w' || e.key === 'ArrowUp') keys.w = true;
                if (k === 's' || e.key === 'ArrowDown') keys.s = true;
                if (k === 'a' || e.key === 'ArrowLeft') keys.a = true;
                if (k === 'd' || e.key === 'ArrowRight') keys.d = true;
                if (e.code === 'Space') keys.space = true;
                if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') keys.shift = true;
            });
            window.addEventListener('keyup', (e) => {
                const k = e.key.toLowerCase();
                if (k === 'w' || e.key === 'ArrowUp') keys.w = false;
                if (k === 's' || e.key === 'ArrowDown') keys.s = false;
                if (k === 'a' || e.key === 'ArrowLeft') keys.a = false;
                if (k === 'd' || e.key === 'ArrowRight') keys.d = false;
                if (e.code === 'Space') keys.space = false;
                if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') keys.shift = false;
            });

            const clock = new THREE.Clock();

            function animate() {
                requestAnimationFrame(animate);
                const delta = clock.getDelta();
                const elapsed = clock.getElapsedTime();

                // Peanut wandering across a wider path in the doubled town
                const nextX = Math.sin((elapsed + 0.05) * 0.4) * 20;
                const nextZ = Math.cos((elapsed + 0.05) * 0.35) * 20;
                
                const currentX = Math.sin(elapsed * 0.4) * 20;
                const currentZ = Math.cos(elapsed * 0.35) * 20;

                const moveX = nextX - currentX;
                const moveZ = nextZ - currentZ;

                peanutGroup.position.x = currentX;
                peanutGroup.position.z = currentZ;
                peanutGroup.position.y = Math.abs(Math.sin(elapsed * 10)) * 0.15;

                if (Math.abs(moveX) > 0.0001 || Math.abs(moveZ) > 0.0001) {
                    peanutGroup.rotation.y = Math.atan2(moveX, moveZ);
                }

                // Blinking animation
                const blinkTimer = elapsed % 3.5;
                if (blinkTimer < 0.12) {
                    eyeGroup.scale.y = 0.1;
                } else {
                    eyeGroup.scale.y = 1.0;
                }
                document.getElementById('coords').innerText = `X: ${peanutGroup.position.x.toFixed(1)}, Z: ${peanutGroup.position.z.toFixed(1)}`;

                // Camera Movement
                const moveSpeed = 18.0 * delta;
                if (keys.w) controls.moveForward(moveSpeed);
                if (keys.s) controls.moveForward(-moveSpeed);
                if (keys.a) controls.moveRight(-moveSpeed);
                if (keys.d) controls.moveRight(moveSpeed);
                if (keys.space) camera.position.y += moveSpeed;
                if (keys.shift) camera.position.y = Math.max(1.8, camera.position.y - moveSpeed);

                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

        } catch (err) {
            console.error("💥 Critical Setup Error:", err);
            statusEl.innerText = "Script Error: " + err.message;
            statusEl.style.color = "#ff5555";
        }
    </script>
</body>
</html>
