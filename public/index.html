<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Badabing - Safehouse Town</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a24;
            font-family: sans-serif;
            color: #fff;
            user-select: none;
        }
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(20, 20, 28, 0.95);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            z-index: 10;
            width: 290px;
        }
        h1 { margin: 0 0 5px 0; font-size: 18px; color: #ff5555; }
        p { margin: 0 0 6px 0; font-size: 12px; color: #ccc; }
        #status { font-weight: bold; color: #ffaa00; }

        #god-mode-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(20, 20, 28, 0.95);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ff5555;
            z-index: 10;
            width: 240px;
        }
        #god-mode-panel h2 { margin: 0 0 10px 0; font-size: 15px; color: #ff5555; }
        .station-btn {
            display: block;
            width: 100%;
            padding: 9px;
            margin-bottom: 8px;
            background: #2a2a38;
            border: 1px solid #4a4a5e;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            text-align: left;
            font-size: 13px;
        }
        .station-btn:hover { background: #ff5555; }
        .station-btn.active { background: #e63939; font-weight: bold; }
        #controls-hint {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(20, 20, 28, 0.9);
            padding: 12px 18px;
            border-radius: 6px;
            border: 1px solid #444;
            font-size: 12px;
            color: #ddd;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="info-panel">
        <h1>The Badabing 🦫</h1>
        <p>Status: <span id="status">Connecting...</span></p>
        <p>Peanut's Position: <span id="coords">X: 0, Z: 0</span></p>
        <p>Cam Mode: <span id="cam-mode" style="color: #55ff55;">Free Orbit</span></p>
    </div>

    <div id="god-mode-panel">
        <h2>God Mode</h2>
        <button class="station-btn" data-type="workbench">🛠️ Industrial Workbench</button>
        <button class="station-btn" data-type="crate">📦 Storage Crate</button>
        <button class="station-btn" data-type="bed">🛌 Recovery Pod</button>
        <button class="station-btn" data-type="none" style="background: #4a2222;">❌ Clear Selection</button>
    </div>

    <div id="controls-hint">
        Orbit: Left Click Drag | Pan: Right Click Drag | Zoom: Scroll<br>
        Toggle Follow Peanut: <span>Press 'C'</span>
    </div>

    <!-- Import Three.js via CDN -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        console.log("🚀 Initializing Three.js Scene...");

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1e222a);
        scene.fog = new THREE.FogExp2(0x1e222a, 0.012);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1500);
        camera.position.set(0, 35, 45);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 0, 0);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xddeeff, 0.75);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfff8ee, 1.4);
        sunLight.position.set(45, 70, 35);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // Ground Floor
        const groundGeo = new THREE.PlaneGeometry(300, 300);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x2b2f38, roughness: 0.9 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Peanut (Bird) Mesh
        const peanutGroup = new THREE.Group();
        scene.add(peanutGroup);

        const featherMat = new THREE.MeshStandardMaterial({ color: 0xff8c00, roughness: 0.3 });
        const birdBody = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 16), featherMat);
        birdBody.position.y = 0.6;
        peanutGroup.add(birdBody);

        const birdHead = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), featherMat);
        birdHead.position.set(0, 0.95, 0.35);
        peanutGroup.add(birdHead);

        // Stations Group
        const stationsGroup = new THREE.Group();
        scene.add(stationsGroup);

        // WebSocket Connection
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}`;
        console.log("🔌 Connecting to WebSocket at:", wsUrl);

        const ws = new WebSocket(wsUrl);
        const statusEl = document.getElementById('status');
        const coordsEl = document.getElementById('coords');

        ws.onopen = () => {
            console.log("✅ WebSocket Connected!");
            statusEl.innerText = "Connected";
            statusEl.style.color = "#55ff55";
        };

        ws.onerror = (err) => {
            console.error("❌ WebSocket Error:", err);
            statusEl.innerText = "Connection Error";
            statusEl.style.color = "#ff5555";
        };

        ws.onclose = () => {
            console.warn("⚠️ WebSocket Disconnected");
            statusEl.innerText = "Disconnected";
            statusEl.style.color = "#ff5555";
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'init_world' || data.type === 'bird:position') {
                if (data.state?.bird) {
                    peanutGroup.position.x = data.state.bird.x;
                    peanutGroup.position.z = data.state.bird.z;
                    coordsEl.innerText = `X: ${data.state.bird.x.toFixed(2)}, Z: ${data.state.bird.z.toFixed(2)}`;
                }
                if (data.bird) {
                    peanutGroup.position.x = data.bird.x;
                    peanutGroup.position.z = data.bird.z;
                    coordsEl.innerText = `X: ${data.bird.x.toFixed(2)}, Z: ${data.bird.z.toFixed(2)}`;
                }
            }
        };

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
