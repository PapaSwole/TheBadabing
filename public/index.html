<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Badabing - First-Person Walkthrough</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a24;
            font-family: sans-serif;
            color: #fff;
            user-select: none;
        }
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(20, 20, 28, 0.95);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            z-index: 10;
            width: 290px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        h1 { margin: 0 0 5px 0; font-size: 18px; color: #ff5555; }
        p { margin: 0 0 6px 0; font-size: 12px; color: #ccc; }
        #status { font-weight: bold; color: #ffaa00; }

        #god-mode-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(20, 20, 28, 0.95);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #00aaff;
            z-index: 10;
            width: 240px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        #god-mode-panel h2 { margin: 0 0 10px 0; font-size: 15px; color: #00aaff; }
        .station-btn {
            display: block;
            width: 100%;
            padding: 9px;
            margin-bottom: 8px;
            background: #2a2a38;
            border: 1px solid #4a4a5e;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            text-align: left;
            font-size: 13px;
            transition: 0.2s;
        }
        .station-btn:hover { background: #00aaff; border-color: #00aaff; }
        .station-btn.active { background: #0088cc; border-color: #fff; font-weight: bold; }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
        }
        #controls-hint {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(20, 20, 28, 0.9);
            padding: 12px 18px;
            border-radius: 6px;
            border: 1px solid #444;
            font-size: 12px;
            color: #ddd;
            z-index: 10;
            line-height: 1.5;
        }
        #controls-hint span { color: #00aaff; font-weight: bold; }
    </style>
</head>
<body>

    <div id="crosshair"></div>

    <div id="info-panel">
        <h1>The Badabing 🦫</h1>
        <p>Status: <span id="status">Connecting...</span></p>
        <p>Peanut's Pos: <span id="coords">X: 0, Z: 0</span></p>
        <p>Cam Mode: <span id="cam-mode" style="color: #00aaff;">First-Person Walkthrough</span></p>
    </div>

    <div id="god-mode-panel">
        <h2>Admin Builder Tools</h2>
        <p>Select asset to spawn:</p>
        <button class="station-btn" data-type="workbench">🛠️ Industrial Workbench</button>
        <button class="station-btn" data-type="crate">📦 Storage Crate Stack</button>
        <button class="station-btn" data-type="bed">🛌 Recovery Pod</button>
        <button class="station-btn" data-type="none" style="background: #4a2222;">❌ Clear Selection</button>
    </div>

    <div id="controls-hint">
        Click screen to lock mouse & look around<br>
        Walk: <span>WASD</span> | Exit Mouse Lock: <span>ESC</span><br>
        Build Asset: <span>Left Click on Ground</span>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        const statusEl = document.getElementById('status');
        const coordsEl = document.getElementById('coords');

        try {
            console.log("🚀 Starting First-Person Walkthrough Setup...");

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1e222a);
            scene.fog = new THREE.FogExp2(0x1e222a, 0.015);

            const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1500);
            camera.position.set(0, 1.7, 10); // Eye-level view in the street

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // First-person pointer lock controls
            const controls = new PointerLockControls(camera, document.body);

            document.body.addEventListener('click', () => {
                if (selectedTool === null) {
                    controls.lock();
                }
            });

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xddeeff, 0.65);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfff8ee, 1.3);
            sunLight.position.set(45, 70, 35);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            scene.add(sunLight);

            // Texture Loader
            const textureLoader = new THREE.TextureLoader();
            function loadTexture(url, repeatX = 1, repeatY = 1) {
                const tex = textureLoader.load(url);
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                tex.repeat.set(repeatX, repeatY);
                return tex;
            }

            const groundTex = loadTexture('https://images.unsplash.com/photo-1558449028-b53a39d100fc?w=512', 40, 40);
            const grassTex = loadTexture('https://images.unsplash.com/photo-1589135069168-12c5b8b931dd?w=512', 4, 4);
            const brickTex = loadTexture('https://images.unsplash.com/photo-1590073242678-70ee3fc28e8e?w=512', 3, 3);
            const concreteTex = loadTexture('https://images.unsplash.com/photo-1518640467707-6811f4a6ab73?w=512', 3, 3);
            const woodTex = loadTexture('https://images.unsplash.com/photo-1546484396-fb3fc6f95f98?w=512', 2, 2);

            // Ground
            const groundGeo = new THREE.PlaneGeometry(300, 300);
            const groundMat = new THREE.MeshStandardMaterial({ map: groundTex, roughness: 0.8 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Town & Buildings
            const townGroup = new THREE.Group();
            scene.add(townGroup);

            const roadLineMat = new THREE.MeshBasicMaterial({ color: 0xddaa00 });
            const crosswalkMat = new THREE.MeshBasicMaterial({ color: 0xdddddd });
            const metalTrimMat = new THREE.MeshStandardMaterial({ color: 0x3e424b, metalness: 0.6, roughness: 0.5 });
            const windowGlassMat = new THREE.MeshStandardMaterial({ color: 0x1f3b4f, metalness: 0.9, roughness: 0.1 });
            const awningRed = new THREE.MeshStandardMaterial({ color: 0xb82e2e });
            const awningBlue = new THREE.MeshStandardMaterial({ color: 0x256cb3 });
            const awningGreen = new THREE.MeshStandardMaterial({ color: 0x2e8540 });

            const roadNS = new THREE.Mesh(new THREE.PlaneGeometry(16, 240), new THREE.MeshStandardMaterial({ map: groundTex, roughness: 0.6 }));
            roadNS.rotation.x = -Math.PI / 2;
            roadNS.position.set(0, 0.01, 0);
            townGroup.add(roadNS);

            const roadEW = new THREE.Mesh(new THREE.PlaneGeometry(240, 16), new THREE.MeshStandardMaterial({ map: groundTex, roughness: 0.6 }));
            roadEW.rotation.x = -Math.PI / 2;
            roadEW.position.set(0, 0.01, 0);
            townGroup.add(roadEW);

            function createBuilding(x, z, w, h, d, wallTexMap, awningMat) {
                const bld = new THREE.Group();
                const wallMat = new THREE.MeshStandardMaterial({ map: wallTexMap, roughness: 0.8 });
                
                const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
                body.position.set(0, h / 2, 0);
                body.castShadow = true;
                bld.add(body);

                const cornice = new THREE.Mesh(new THREE.BoxGeometry(w + 0.4, 0.5, d + 0.4), metalTrimMat);
                cornice.position.set(0, h + 0.25, 0);
                bld.add(cornice);

                const winWidth = w * 0.5, winHeight = h * 0.35;
                const glass = new THREE.Mesh(new THREE.BoxGeometry(winWidth, winHeight, 0.1), windowGlassMat);
                glass.position.set(-w*0.1, winHeight / 2 + 0.2, d / 2 + 0.03);
                bld.add(glass);

                const door = new THREE.Mesh(new THREE.BoxGeometry(w * 0.18, h * 0.4, 0.1), windowGlassMat);
                door.position.set(w*0.3, h * 0.2, d / 2 + 0.03);
                bld.add(door);

                if (awningMat) {
                    const awning = new THREE.Mesh(new THREE.BoxGeometry(w * 0.85, 0.35, 1.8), awningMat);
                    awning.position.set(0, winHeight + 0.8, d / 2 + 0.8);
                    awning.rotation.x = 0.25;
                    bld.add(awning);
                }

                bld.position.set(x, 0, z);
                townGroup.add(bld);
            }

            createBuilding(0, -35, 24, 9, 16, brickTex, awningRed);
            createBuilding(35, -18, 20, 8, 16, concreteTex, awningGreen);
            createBuilding(-35, 18, 20, 7.5, 16, brickTex, awningRed);
            createBuilding(35, 18, 22, 9, 16, concreteTex, awningBlue);

            // Peanut's Accessible 2-Story House
            function createPeanutHouse(x, z) {
                const house = new THREE.Group();
                const extWallMat = new THREE.MeshStandardMaterial({ map: concreteTex, roughness: 0.8 });
                const intWallMat = new THREE.MeshStandardMaterial({ color: 0xeaeaea, roughness: 0.9 });
                const woodFloorMat = new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.6 });
                const roofMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
                const fenceMat = new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.9 });

                function addWall(w, h, d, px, py, pz, mat) {
                    const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
                    wall.position.set(px, py, pz);
                    wall.castShadow = true;
                    house.add(wall);
                }

                addWall(16, 0.2, 12, 0, 0.1, 0, woodFloorMat); 
                addWall(16, 0.2, 12, 0, 4.1, 0, woodFloorMat); 
                addWall(17, 0.6, 13, 0, 8.3, 0, roofMat);   

                addWall(0.5, 4, 12, -7.75, 2.1, 0, extWallMat); 
                addWall(0.5, 4, 12, 7.75, 2.1, 0, extWallMat);  
                addWall(16, 4, 0.5, 0, 2.1, -5.75, extWallMat); 
                addWall(4, 4, 0.5, 5.75, 2.1, 5.75, extWallMat); 
                addWall(2, 4, 0.5, 0.5, 2.1, 5.75, extWallMat);  
                addWall(0.5, 4, 11.5, -0.5, 2.1, -0.25, intWallMat); 

                addWall(0.5, 4, 12, -7.75, 6.2, 0, extWallMat);
                addWall(0.5, 4, 12, 7.75, 6.2, 0, extWallMat);
                addWall(16, 4, 0.5, 0, 6.2, -5.75, extWallMat);
                addWall(16, 4, 0.5, 0, 6.2, 5.75, extWallMat);
                addWall(0.5, 4, 11.5, -0.5, 6.2, -0.25, intWallMat);

                const yardMat = new THREE.MeshStandardMaterial({ map: grassTex, roughness: 0.9 });
                const yard = new THREE.Mesh(new THREE.PlaneGeometry(16, 16), yardMat);
                yard.rotation.x = -Math.PI/2;
                yard.position.set(0, 0.05, -14);
                yard.receiveShadow = true;
                house.add(yard);

                addWall(0.2, 2, 16, -7.9, 1, -14, fenceMat);
                addWall(0.2, 2, 16, 7.9, 1, -14, fenceMat);
                addWall(16, 2, 0.2, 0, 1, -21.9, fenceMat);

                house.position.set(x, 0, z);
                townGroup.add(house);
            }
            createPeanutHouse(-32, -20); 

            // Peanut Bird Model
            const peanutGroup = new THREE.Group();
            scene.add(peanutGroup);
            const featherMat = new THREE.MeshStandardMaterial({ color: 0xff8c00, roughness: 0.3 });
            const beakMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.2 });
            const birdBody = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 16), featherMat);
            birdBody.scale.set(1, 0.8, 1.3);
            birdBody.position.y = 0.6;
            peanutGroup.add(birdBody);
            const birdHead = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), featherMat);
            birdHead.position.set(0, 0.95, 0.35);
            peanutGroup.add(birdHead);
            const birdBeak = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.3, 8), beakMat);
            birdBeak.rotateX(Math.PI / 2);
            birdBeak.position.set(0, 0.95, 0.65);
            peanutGroup.add(birdBeak);

            // God Mode Stations Group
            const stationsGroup = new THREE.Group();
            scene.add(stationsGroup);
            function createBoxModel(colorHex, w, h, d, yOffset) {
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.5 }));
                mesh.position.y = yOffset;
                mesh.castShadow = true;
                return mesh;
            }
            function updateStations(stations) {
                while(stationsGroup.children.length > 0) stationsGroup.remove(stationsGroup.children[0]); 
                stations.forEach(st => {
                    let model;
                    if (st.type === 'workbench') model = createBoxModel(0x7c471b, 1.5, 1, 0.8, 0.5);
                    else if (st.type === 'crate') model = createBoxModel(0xbd7d4b, 0.8, 0.8, 0.8, 0.4);
                    else if (st.type === 'bed') model = createBoxModel(0x1b4d3e, 1.2, 0.3, 2, 0.15);
                    else model = createBoxModel(0xaaaaaa, 1, 1, 1, 0.5);
                    model.position.set(st.gridX, 0, st.gridZ);
                    model.userData = { uid: st.uid };
                    stationsGroup.add(model);
                });
            }

            // WebSocket Connection
            let ws;
            function connectWebSocket() {
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${protocol}//${window.location.host}`;
                ws = new WebSocket(wsUrl);
                
                ws.onopen = () => { statusEl.innerText = "Connected (Click to Walk)"; statusEl.style.color = "#55ff55"; };
                ws.onclose = () => { 
                    statusEl.innerText = "Connecting..."; 
                    setTimeout(connectWebSocket, 3000); 
                };
                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    if (data.type === 'init_world' || data.type === 'world:stations_updated') {
                        if (data.stations) updateStations(data.stations);
                    }
                    const birdData = data.bird || data.state?.bird;
                    if (birdData) {
                        const moveX = birdData.x - peanutGroup.position.x;
                        const moveZ = birdData.z - peanutGroup.position.z;
                        peanutGroup.position.x = birdData.x;
                        peanutGroup.position.z = birdData.z;
                        coordsEl.innerText = `X: ${birdData.x.toFixed(2)}, Z: ${birdData.z.toFixed(2)}`;
                        if (Math.abs(moveX) > 0.001 || Math.abs(moveZ) > 0.001) {
                            peanutGroup.rotation.y = Math.atan2(moveX, moveZ);
                        }
                    }
                };
            }
            connectWebSocket();

            // First-Person WASD Movement
            const keys = { w: false, a: false, s: false, d: false };
            window.addEventListener('keydown', (e) => {
                const k = e.key.toLowerCase();
                if (k === 'w' || e.key === 'arrowup') keys.w = true;
                if (k === 's' || e.key === 'arrowdown') keys.s = true;
                if (k === 'a' || e.key === 'arrowleft') keys.a = true;
                if (k === 'd' || e.key === 'arrowright') keys.d = true;
            });
            window.addEventListener('keyup', (e) => {
                const k = e.key.toLowerCase();
                if (k === 'w' || e.key === 'arrowup') keys.w = false;
                if (k === 's' || e.key === 'arrowdown') keys.s = false;
                if (k === 'a' || e.key === 'arrowleft') keys.a = false;
                if (k === 'd' || e.key === 'arrowright') keys.d = false;
            });

            // Building Logic
            let selectedTool = null;
            document.querySelectorAll('.station-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.station-btn').forEach(b => b.classList.remove('active'));
                    const type = e.target.getAttribute('data-type');
                    if (type === 'none') {
                        selectedTool = null;
                    } else {
                        selectedTool = type;
                        e.target.classList.add('active');
                        // Unlock pointer so user can click UI buttons easily
                        if (controls.isLocked) controls.unlock();
                    }
                });
            });

            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();

            window.addEventListener('click', (event) => {
                if (event.clientX > window.innerWidth - 260 && event.clientY < 240) return;
                if (event.clientX < 320 && event.clientY < 180) return;

                if (selectedTool) {
                    mouse.x = 0; // Center of screen for first-person placement
                    mouse.y = 0;
                    raycaster.setFromCamera(mouse, camera);

                    const intersectsGround = raycaster.intersectObject(ground);
                    if (intersectsGround.length > 0) {
                        const point = intersectsGround[0].point;
                        if(ws && ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({ 
                                type: 'admin:place_station', 
                                station: {
                                    uid: `station_${Date.now()}`, type: selectedTool,
                                    gridX: Math.round(point.x), gridZ: Math.round(point.z),
                                    rotation: 0, footprintX: 1, footprintZ: 1
                                }
                            }));
                        }
                    }
                }
            });

            // Animation Loop & First-Person Movement Physics
            const clock = new THREE.Clock();
            const velocity = new THREE.Vector3();
            const direction = new THREE.Vector3();

            function animate() {
                requestAnimationFrame(animate);
                const delta = clock.getDelta();
                const elapsedTime = clock.getElapsedTime();

                peanutGroup.position.y = Math.abs(Math.sin(elapsedTime * 10)) * 0.15;

                if (controls.isLocked === true) {
                    direction.z = Number(keys.w) - Number(keys.s);
                    direction.x = Number(keys.d) - Number(keys.a);
                    direction.normalize();

                    const moveSpeed = 8.0;
                    if (keys.w || keys.s) controls.moveForward(direction.z * moveSpeed * delta);
                    if (keys.a || keys.d) controls.moveRight(direction.x * moveSpeed * delta);

                    // Keep camera locked at eye level height
                    camera.position.y = 1.7;
                }

                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

        } catch (err) {
            console.error("💥 Critical Script Error:", err);
            statusEl.innerText = "Script Error";
            statusEl.style.color = "#ff0000";
        }
    </script>
</body>
</html>
