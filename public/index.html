<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Badabing - Safehouse Town & God Mode</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #111;
            font-family: sans-serif;
            color: #fff;
            user-select: none;
        }
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            pointer-events: auto;
            z-index: 10;
            width: 260px;
        }
        h1 { margin: 0 0 5px 0; font-size: 18px; color: #ff5555; }
        p { margin: 0 0 8px 0; font-size: 13px; color: #aaa; }
        #status { font-weight: bold; color: #55ff55; }

        #god-mode-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ff5555;
            z-index: 10;
            width: 240px;
        }
        #god-mode-panel h2 { margin: 0 0 10px 0; font-size: 16px; color: #ff5555; }
        .station-btn {
            display: block;
            width: 100%;
            padding: 8px;
            margin-bottom: 8px;
            background: #222;
            border: 1px solid #555;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            text-align: left;
            font-size: 13px;
            transition: 0.2s;
        }
        .station-btn:hover { background: #ff5555; border-color: #ff5555; }
        .station-btn.active { background: #ff3333; border-color: #fff; font-weight: bold; }
        #instructions { font-size: 11px; color: #888; margin-top: 5px; line-height: 1.4; }
    </style>
</head>
<body>

    <div id="info-panel">
        <h1>The Badabing 🦫</h1>
        <p>Status: <span id="status">Connecting...</span></p>
        <p>Peanut Coordinates: <span id="coords">X: 0, Z: 0</span></p>
    </div>

    <div id="god-mode-panel">
        <h2>God Mode Base-Building</h2>
        <p>Select an asset to place:</p>
        <button class="station-btn" data-type="workbench">🛠️ Workbench</button>
        <button class="station-btn" data-type="crate">📦 Storage Crate</button>
        <button class="station-btn" data-type="bed">🛌 Recovery Pod</button>
        <button class="station-btn" data-type="none" style="background: #442222;">❌ Clear Selection</button>
        <div id="instructions">Click on the town grid to spawn items. Click an existing item to delete it.</div>
    </div>

    <!-- Import Three.js via CDN -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. Scene, Camera, Renderer Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x121216);
        scene.fog = new THREE.FogExp2(0x121216, 0.025);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 22, 28);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 0, 0);

        // 2. Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfff5e6, 0.9);
        dirLight.position.set(15, 30, 15);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 3. Ground & Town Architecture Layout
        const gridHelper = new THREE.GridHelper(50, 50, 0xff5555, 0x333333);
        gridHelper.position.y = 0;
        scene.add(gridHelper);

        const floorGeo = new THREE.PlaneGeometry(50, 50);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x1b1b1f, roughness: 0.9 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Build Town Perimeter Walls & Safehouse Structures
        const townGroup = new THREE.Group();
        scene.add(townGroup);

        function buildTownLayout() {
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x3a3a42, roughness: 0.7 });
            const trimMat = new THREE.MeshStandardMaterial({ color: 0xcc4444, roughness: 0.5 });

            // Perimeter Boundary Walls (Safehouse Compound)
            const walls = [
                { x: 0, z: -25, w: 50, h: 3, d: 1 }, // North Wall
                { x: 0, z: 25, w: 50, h: 3, d: 1 },  // South Wall
                { x: -25, z: 0, w: 1, h: 3, d: 50 }, // West Wall
                { x: 25, z: 0, w: 1, h: 3, d: 50 },  // East Wall
            ];

            walls.forEach(wData => {
                const geo = new THREE.BoxGeometry(wData.w, wData.h, wData.d);
                const mesh = new THREE.Mesh(geo, wallMat);
                mesh.position.set(wData.x, wData.h / 2, wData.z);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                townGroup.add(mesh);
            });

            // Central Safehouse Building (The Badabing HQ)
            const hqGeo = new THREE.BoxGeometry(14, 5, 10);
            const hqMat = new THREE.MeshStandardMaterial({ color: 0x282830, roughness: 0.6 });
            const hq = new THREE.Mesh(hqGeo, hqMat);
            hq.position.set(0, 2.5, -12);
            hq.castShadow = true;
            hq.receiveShadow = true;
            townGroup.add(hq);

            // HQ Roof Trim
            const roofGeo = new THREE.BoxGeometry(15, 0.6, 11);
            const roof = new THREE.Mesh(roofGeo, trimMat);
            roof.position.set(0, 5.3, -12);
            roof.castShadow = true;
            townGroup.add(roof);

            // Side Storage Modules (Left & Right Wings)
            const wingGeo = new THREE.BoxGeometry(8, 3.5, 8);
            
            const leftWing = new THREE.Mesh(wingGeo, wallMat);
            leftWing.position.set(-16, 1.75, -12);
            leftWing.castShadow = true;
            leftWing.receiveShadow = true;
            townGroup.add(leftWing);

            const rightWing = new THREE.Mesh(wingGeo, wallMat);
            rightWing.position.set(16, 1.75, -12);
            rightWing.castShadow = true;
            rightWing.receiveShadow = true;
            townGroup.add(rightWing);
        }

        buildTownLayout();

        // 4. Peanut (The Bird Representation)
        const peanutGeo = new THREE.BoxGeometry(1, 1, 1);
        const peanutMat = new THREE.MeshStandardMaterial({ color: 0xffaa00, roughness: 0.3 });
        const peanutMesh = new THREE.Mesh(peanutGeo, peanutMat);
        peanutMesh.position.y = 0.5;
        peanutMesh.castShadow = true;
        scene.add(peanutMesh);

        // Station Meshes Group
        const stationsGroup = new THREE.Group();
        scene.add(stationsGroup);

        // 5. WebSocket Connection to Live Backend
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}`;
        const ws = new WebSocket(wsUrl);

        const statusEl = document.getElementById('status');
        const coordsEl = document.getElementById('coords');

        ws.onopen = () => {
            statusEl.innerText = "Connected to Town Server";
            statusEl.style.color = "#55ff55";
        };

        ws.onclose = () => {
            statusEl.innerText = "Disconnected";
            statusEl.style.color = "#ff5555";
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);

            if (data.type === 'init_world') {
                updateStations(data.stations);
                if (data.state?.bird) updateBird(data.state.bird);
            }

            if (data.type === 'world:stations_updated') {
                updateStations(data.stations);
            }

            if (data.type === 'bird:position') {
                updateBird(data.bird);
            }
        };

        function updateBird(bird) {
            peanutMesh.position.x = bird.x;
            peanutMesh.position.z = bird.z;
            coordsEl.innerText = `X: ${bird.x.toFixed(2)}, Z: ${bird.z.toFixed(2)}`;
        }

        function updateStations(stations) {
            while(stationsGroup.children.length > 0){ 
                stationsGroup.remove(stationsGroup.children[0]); 
            }

            stations.forEach(st => {
                let color = 0x888888;
                let sizeY = 1;
                if (st.type === 'workbench') { color = 0x3388ff; sizeY = 1.2; }
                else if (st.type === 'crate') { color = 0xcc8833; sizeY = 0.8; }
                else if (st.type === 'bed') { color = 0x33cc66; sizeY = 0.5; }

                const geo = new THREE.BoxGeometry(st.footprintX, sizeY, st.footprintZ);
                const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.4 });
                const mesh = new THREE.Mesh(geo, mat);
                
                mesh.position.set(st.gridX, sizeY / 2, st.gridZ);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                mesh.userData = { uid: st.uid };

                stationsGroup.add(mesh);
            });
        }

        // 6. God Mode Placement Logic
        let selectedTool = null;

        document.querySelectorAll('.station-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.station-btn').forEach(b => b.classList.remove('active'));
                const type = e.target.getAttribute('data-type');
                if (type === 'none') {
                    selectedTool = null;
                } else {
                    selectedTool = type;
                    e.target.classList.add('active');
                }
            });
        });

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (event) => {
            if (event.clientX > window.innerWidth - 280 && event.clientY < 300) return;
            if (event.clientX < 280 && event.clientY < 200) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            const intersectsStations = raycaster.intersectObjects(stationsGroup.children);
            if (intersectsStations.length > 0) {
                if (!selectedTool) {
                    const hitUid = intersectsStations[0].object.userData.uid;
                    ws.send(JSON.stringify({ type: 'admin:delete_station', uid: hitUid }));
                    return;
                }
            }

            if (selectedTool) {
                const intersectsFloor = raycaster.intersectObject(floor);
                if (intersectsFloor.length > 0) {
                    const point = intersectsFloor[0].point;
                    const gridX = Math.round(point.x);
                    const gridZ = Math.round(point.z);
                    const uid = `station_${Date.now()}_${Math.floor(Math.random()*1000)}`

                    const newStation = {
                        uid,
                        type: selectedTool,
                        gridX,
                        gridZ,
                        rotation: 0,
                        footprintX: 1,
                        footprintZ: 1
                    };

                    ws.send(JSON.stringify({ type: 'admin:place_station', station: newStation }));
                }
            }
        });

        // 7. Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
