<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Badabing - Peanut with Visible Cute Eyes</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a24;
            font-family: sans-serif;
            color: #fff;
            user-select: none;
        }
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(20, 20, 28, 0.92);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            z-index: 10;
            width: 290px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        h1 { margin: 0 0 5px 0; font-size: 18px; color: #ff5555; }
        p { margin: 0 0 6px 0; font-size: 12px; color: #ccc; }
        #status { font-weight: bold; color: #ffaa00; }

        #god-mode-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(20, 20, 28, 0.92);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #00aaff;
            z-index: 10;
            width: 240px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        #god-mode-panel h2 { margin: 0 0 10px 0; font-size: 15px; color: #00aaff; }
        .station-btn {
            display: block;
            width: 100%;
            padding: 9px;
            margin-bottom: 8px;
            background: #2a2a38;
            border: 1px solid #4a4a5e;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            text-align: left;
            font-size: 13px;
            transition: 0.2s;
        }
        .station-btn:hover { background: #00aaff; border-color: #00aaff; }
        .station-btn.active { background: #0088cc; border-color: #fff; font-weight: bold; }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
        }
        #controls-hint {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(20, 20, 28, 0.9);
            padding: 12px 18px;
            border-radius: 6px;
            border: 1px solid #444;
            font-size: 12px;
            color: #ddd;
            z-index: 10;
            line-height: 1.5;
        }
        #controls-hint span { color: #00aaff; font-weight: bold; }
    </style>
</head>
<body>

    <div id="crosshair"></div>

    <div id="info-panel">
        <h1>The Badabing 🦫</h1>
        <p>Status: <span id="status">Connecting...</span></p>
        <p>Peanut's Pos: <span id="coords">X: 0, Z: 0</span></p>
        <p>Cam Mode: <span id="cam-mode" style="color: #00aaff;">1st-Person God Mode</span></p>
    </div>

    <div id="god-mode-panel">
        <h2>Admin Builder Tools</h2>
        <p>Press <b>ESC</b> to unlock mouse & select:</p>
        <button class="station-btn" data-type="workbench">🛠️ Industrial Workbench</button>
        <button class="station-btn" data-type="crate">📦 Storage Crate Stack</button>
        <button class="station-btn" data-type="bed">🛌 Recovery Pod</button>
        <button class="station-btn" data-type="delete" style="background: #5a2e2e;">🗑️ Delete Mode</button>
        <button class="station-btn" data-type="none" style="background: #333;">✋ Hands Empty (Look Mode)</button>
    </div>

    <div id="controls-hint">
        Click Scene: <span>Lock Mouse Look</span> | Walk: <span>WASD / Arrows</span><br>
        Up/Down (Fly): <span>Space / Shift</span> | Unlock UI: <span>ESC</span><br>
        Place / Delete Prop: <span>Left Click Aimed Spot</span>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        const statusEl = document.getElementById('status');
        const coordsEl = document.getElementById('coords');

        try {
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87a8d0);
            scene.fog = new THREE.FogExp2(0x87a8d0, 0.006);

            const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1500);
            camera.position.set(0, 2.0, 18);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.1;
            document.body.appendChild(renderer.domElement);

            const maxAnisotropy = renderer.capabilities.getMaxAnisotropy();

            // Procedural Texture Engine
            function makeSeamlessTexture(drawFn, repeatX = 1, repeatY = 1) {
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');
                drawFn(ctx, 512, 512);
                const tex = new THREE.CanvasTexture(canvas);
                tex.wrapS = THREE.RepeatWrapping;
                tex.wrapT = THREE.RepeatWrapping;
                tex.repeat.set(repeatX, repeatY);
                tex.anisotropy = maxAnisotropy;
                tex.colorSpace = THREE.SRGBColorSpace;
                return tex;
            }

            function createGrassTexture(repX, repY) {
                return makeSeamlessTexture((ctx, w, h) => {
                    ctx.fillStyle = '#2d5a27';
                    ctx.fillRect(0, 0, w, h);
                    const colors = ['#244d1e', '#35682d', '#3e7835', '#1f421a', '#4a853b'];
                    for (let i = 0; i < 35000; i++) {
                        ctx.fillStyle = colors[i % colors.length];
                        ctx.fillRect(Math.random() * w, Math.random() * h, 2, 5);
                    }
                }, repX, repY);
            }

            function createAsphaltTexture(repX, repY) {
                return makeSeamlessTexture((ctx, w, h) => {
                    ctx.fillStyle = '#26292e';
                    ctx.fillRect(0, 0, w, h);
                    for (let i = 0; i < 45000; i++) {
                        const v = 25 + Math.floor(Math.random() * 38);
                        ctx.fillStyle = `rgb(${v},${v},${v + 3})`;
                        ctx.fillRect(Math.random() * w, Math.random() * h, 2, 2);
                    }
                }, repX, repY);
            }

            function createConcreteTexture(repX, repY) {
                return makeSeamlessTexture((ctx, w, h) => {
                    ctx.fillStyle = '#8c9298';
                    ctx.fillRect(0, 0, w, h);
                    for (let i = 0; i < 25000; i++) {
                        const v = 120 + Math.floor(Math.random() * 45);
                        ctx.fillStyle = `rgb(${v},${v},${v})`;
                        ctx.fillRect(Math.random() * w, Math.random() * h, 2, 2);
                    }
                    ctx.strokeStyle = '#686d73';
                    ctx.lineWidth = 4;
                    ctx.strokeRect(2, 2, w - 4, h - 4);
                }, repX, repY);
            }

            function createBrickTexture(baseR, baseG, baseB, repX, repY) {
                return makeSeamlessTexture((ctx, w, h) => {
                    ctx.fillStyle = '#b5b0a8';
                    ctx.fillRect(0, 0, w, h);
                    const rows = 16, cols = 8;
                    const brickH = h / rows, brickW = w / cols, mortar = 4;
                    for (let r = 0; r < rows; r++) {
                        const offset = (r % 2 === 1) ? brickW / 2 : 0;
                        for (let c = -1; c <= cols; c++) {
                            const shift = (Math.random() * 26) - 13;
                            ctx.fillStyle = `rgb(${Math.min(255, Math.max(0, baseR + shift))},${Math.min(255, Math.max(0, baseG + shift))},${Math.min(255, Math.max(0, baseB + shift))})`;
                            const bx = c * brickW + offset + mortar / 2;
                            const by = r * brickH + mortar / 2;
                            ctx.fillRect(bx, by, brickW - mortar, brickH - mortar);
                        }
                    }
                }, repX, repY);
            }

            function createSidingTexture(repX, repY) {
                return makeSeamlessTexture((ctx, w, h) => {
                    const planks = 16, pH = h / planks;
                    for (let i = 0; i < planks; i++) {
                        ctx.fillStyle = i % 2 === 0 ? '#687685' : '#62707e';
                        ctx.fillRect(0, i * pH, w, pH);
                        ctx.fillStyle = '#45505b';
                        ctx.fillRect(0, (i + 1) * pH - 3, w, 3);
                    }
                }, repX, repY);
            }

            function createWoodTexture(repX, repY) {
                return makeSeamlessTexture((ctx, w, h) => {
                    ctx.fillStyle = '#7c5230';
                    ctx.fillRect(0, 0, w, h);
                    const planks = 8, pW = w / planks;
                    for (let i = 0; i < planks; i++) {
                        const shade = (Math.random() * 16) - 8;
                        ctx.fillStyle = `rgb(${124 + shade}, ${82 + shade}, ${48 + shade})`;
                        ctx.fillRect(i * pW, 0, pW - 2, h);
                        ctx.fillStyle = '#3d2614';
                        ctx.fillRect((i + 1) * pW - 2, 0, 2, h);
                    }
                }, repX, repY);
            }

            const grassGroundMat = new THREE.MeshStandardMaterial({ map: createGrassTexture(45, 45), roughness: 0.95 });
            const yardGrassMat   = new THREE.MeshStandardMaterial({ map: createGrassTexture(6, 6), roughness: 0.9 });
            const asphaltMat     = new THREE.MeshStandardMaterial({ map: createAsphaltTexture(4, 50), roughness: 0.85 });
            const asphaltEWMat   = new THREE.MeshStandardMaterial({ map: createAsphaltTexture(50, 4), roughness: 0.85 });
            const sidewalkMat    = new THREE.MeshStandardMaterial({ map: createConcreteTexture(2, 60), roughness: 0.8 });
            const redBrickMat    = new THREE.MeshStandardMaterial({ map: createBrickTexture(145, 62, 48, 4, 2.5), roughness: 0.85 });
            const brownBrickMat  = new THREE.MeshStandardMaterial({ map: createBrickTexture(95, 78, 68, 4, 2.5), roughness: 0.85 });
            const creamBrickMat  = new THREE.MeshStandardMaterial({ map: createBrickTexture(165, 150, 130, 4, 2.5), roughness: 0.85 });
            const sidingMat      = new THREE.MeshStandardMaterial({ map: createSidingTexture(3, 2), roughness: 0.75 });
            const woodFloorMat   = new THREE.MeshStandardMaterial({ map: createWoodTexture(4, 4), roughness: 0.55 });
            const fenceWoodMat   = new THREE.MeshStandardMaterial({ map: createWoodTexture(6, 1), roughness: 0.85 });

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfff6e5, 1.4);
            sunLight.position.set(55, 85, 45);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            const d = 80;
            sunLight.shadow.camera.left = -d;
            sunLight.shadow.camera.right = d;
            sunLight.shadow.camera.top = d;
            sunLight.shadow.camera.bottom = -d;
            scene.add(sunLight);

            const ground = new THREE.Mesh(new THREE.PlaneGeometry(350, 350), grassGroundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Town Roads & Sidewalks
            const townGroup = new THREE.Group();
            scene.add(townGroup);

            const roadLineMat = new THREE.MeshBasicMaterial({ color: 0xf5b700 });
            const crosswalkMat = new THREE.MeshBasicMaterial({ color: 0xeeeeee });
            const metalTrimMat = new THREE.MeshStandardMaterial({ color: 0x333840, metalness: 0.6, roughness: 0.4 });
            const windowGlassMat = new THREE.MeshStandardMaterial({ color: 0x1c3545, metalness: 0.85, roughness: 0.1 });
            const awningRed = new THREE.MeshStandardMaterial({ color: 0xb82e2e, roughness: 0.6 });
            const awningBlue = new THREE.MeshStandardMaterial({ color: 0x256cb3, roughness: 0.6 });
            const awningGreen = new THREE.MeshStandardMaterial({ color: 0x2e8540, roughness: 0.6 });

            const roadNS = new THREE.Mesh(new THREE.PlaneGeometry(16, 260), asphaltMat);
            roadNS.rotation.x = -Math.PI / 2;
            roadNS.position.set(0, 0.02, 0);
            townGroup.add(roadNS);

            const roadEW = new THREE.Mesh(new THREE.PlaneGeometry(260, 16), asphaltEWMat);
            roadEW.rotation.x = -Math.PI / 2;
            roadEW.position.set(0, 0.025, 0);
            townGroup.add(roadEW);

            [-9.75, 9.75].forEach(offset => {
                const swNS = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.16, 260), sidewalkMat);
                swNS.position.set(offset, 0.08, 0);
                townGroup.add(swNS);
                const swEW = new THREE.Mesh(new THREE.BoxGeometry(260, 0.16, 3.5), sidewalkMat);
                swEW.position.set(0, 0.08, offset);
                townGroup.add(swEW);
            });

            function createBuilding(x, z, w, h, d, wallMaterial, awningMat) {
                const bld = new THREE.Group();
                const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMaterial);
                body.position.set(0, h / 2, 0);
                body.castShadow = true;
                bld.add(body);

                const cornice = new THREE.Mesh(new THREE.BoxGeometry(w + 0.5, 0.55, d + 0.5), metalTrimMat);
                cornice.position.set(0, h + 0.25, 0);
                bld.add(cornice);

                const winWidth = w * 0.5, winHeight = h * 0.35;
                const glass = new THREE.Mesh(new THREE.BoxGeometry(winWidth, winHeight, 0.12), windowGlassMat);
                glass.position.set(-w * 0.12, winHeight / 2 + 0.3, d / 2 + 0.03);
                bld.add(glass);

                const door = new THREE.Mesh(new THREE.BoxGeometry(w * 0.16, h * 0.38, 0.12), windowGlassMat);
                door.position.set(w * 0.28, (h * 0.38) / 2, d / 2 + 0.03);
                bld.add(door);

                if (awningMat) {
                    const awning = new THREE.Mesh(new THREE.BoxGeometry(w * 0.85, 0.35, 1.9), awningMat);
                    awning.position.set(0, winHeight + 0.8, d / 2 + 0.85);
                    awning.rotation.x = 0.25;
                    bld.add(awning);
                }
                bld.position.set(x, 0, z);
                townGroup.add(bld);
            }

            createBuilding(0, -35, 24, 9, 16, redBrickMat, awningRed);
            createBuilding(35, -18, 20, 8, 16, creamBrickMat, awningGreen);
            createBuilding(-35, 18, 20, 7.5, 16, redBrickMat, awningRed);
            createBuilding(35, 18, 22, 9, 16, brownBrickMat, awningBlue);

            // Peanut's House
            function createPeanutHouse(x, z) {
                const house = new THREE.Group();
                const intWallMat = new THREE.MeshStandardMaterial({ color: 0xf2efe9, roughness: 0.9 });
                const roofMat = new THREE.MeshStandardMaterial({ color: 0x26292e, roughness: 0.8 });

                function addWall(w, h, d, px, py, pz, mat) {
                    const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
                    wall.position.set(px, py, pz);
                    wall.castShadow = true;
                    house.add(wall);
                }

                addWall(16, 0.2, 12, 0, 0.1, 0, woodFloorMat);
                addWall(16, 0.2, 12, 0, 4.1, 0, woodFloorMat);
                addWall(17, 0.6, 13, 0, 8.3, 0, roofMat);

                addWall(0.5, 4, 12, -7.75, 2.1, 0, sidingMat);
                addWall(0.5, 4, 12, 7.75, 2.1, 0, sidingMat);
                addWall(16, 4, 0.5, 0, 2.1, -5.75, sidingMat);
                addWall(4, 4, 0.5, 5.75, 2.1, 5.75, sidingMat);
                addWall(2, 4, 0.5, 0.5, 2.1, 5.75, sidingMat);
                addWall(0.5, 4, 11.5, -0.5, 2.1, -0.25, intWallMat);

                addWall(0.5, 4, 12, -7.75, 6.2, 0, sidingMat);
                addWall(0.5, 4, 12, 7.75, 6.2, 0, sidingMat);
                addWall(16, 4, 0.5, 0, 6.2, -5.75, sidingMat);
                addWall(16, 4, 0.5, 0, 6.2, 5.75, sidingMat);
                addWall(0.5, 4, 11.5, -0.5, 6.2, -0.25, intWallMat);

                const yard = new THREE.Mesh(new THREE.PlaneGeometry(16, 16), yardGrassMat);
                yard.rotation.x = -Math.PI / 2;
                yard.position.set(0, 0.04, -14);
                house.add(yard);

                addWall(0.25, 2.2, 16, -7.9, 1.1, -14, fenceWoodMat);
                addWall(0.25, 2.2, 16, 7.9, 1.1, -14, fenceWoodMat);
                addWall(16, 2.2, 0.25, 0, 1.1, -21.9, fenceWoodMat);

                house.position.set(x, 0, z);
                townGroup.add(house);
            }
            createPeanutHouse(-32, -20);

            // ==========================================
            // PEANUT THE BIRD WITH GUARANTEED VISIBLE EYES
            // ==========================================
            const peanutGroup = new THREE.Group();
            scene.add(peanutGroup);

            const featherMat = new THREE.MeshStandardMaterial({ color: 0xff8c00, roughness: 0.35 });
            const beakMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.2 });

            const birdBody = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 16), featherMat);
            birdBody.scale.set(1, 0.8, 1.
