<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Badabing - Grid Aligned & Cul-de-sac</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a24;
            font-family: sans-serif;
            color: #fff;
            user-select: none;
        }
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(20, 20, 28, 0.95);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            z-index: 10;
            width: 290px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        h1 { margin: 0 0 5px 0; font-size: 18px; color: #ff5555; }
        p { margin: 0 0 6px 0; font-size: 12px; color: #ccc; }
        #status { font-weight: bold; color: #55ff55; }

        #god-mode-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(20, 20, 28, 0.95);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #00aaff;
            z-index: 10;
            width: 240px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        #god-mode-panel h2 { margin: 0 0 10px 0; font-size: 15px; color: #00aaff; }
        .station-btn {
            display: block;
            width: 100%;
            padding: 9px;
            margin-bottom: 8px;
            background: #2a2a38;
            border: 1px solid #4a4a5e;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            text-align: left;
            font-size: 13px;
            transition: 0.2s;
        }
        .station-btn:hover { background: #00aaff; border-color: #00aaff; }
        .station-btn.active { background: #0088cc; border-color: #fff; font-weight: bold; }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
        }
        #controls-hint {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(20, 20, 28, 0.9);
            padding: 12px 18px;
            border-radius: 6px;
            border: 1px solid #444;
            font-size: 12px;
            color: #ddd;
            z-index: 10;
            line-height: 1.5;
        }
        #controls-hint span { color: #00aaff; font-weight: bold; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

    <div id="crosshair"></div>

    <div id="info-panel">
        <h1>The Badabing 🦫</h1>
        <p>Status: <span id="status">Active (Grid Aligned & Cul-de-sac)</span></p>
        <p>Peanut's Pos: <span id="coords">X: 0, Z: 0</span></p>
        <p>Placed Items: <span id="item-count">0</span></p>
    </div>

    <div id="god-mode-panel">
        <h2>God Mode Tools</h2>
        <p>Select item to place / delete:</p>
        <button class="station-btn" data-type="house">🏠 Place Aligned House</button>
        <button class="station-btn" data-type="workbench">🛠️ Industrial Workbench</button>
        <button class="station-btn" data-type="crate">📦 Storage Crate</button>
        <button class="station-btn" data-type="delete" style="background: #5a2e2e;">🗑️ Delete Mode</button>
        <button class="station-btn" data-type="none" style="background: #333;">✋ Hands Empty (Look)</button>
    </div>

    <div id="controls-hint">
        Click Screen: <span>Lock Mouse Look</span> | Walk: <span>WASD</span><br>
        Place Item: <span>Snaps to Grid / Cul-de-sac</span> | ESC: <span>Unlock Mouse</span>
    </div>

    <script>
        try {
            console.log("🚀 Initializing Grid Aligned Town with Cul-de-sac...");

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87a8d0);
            scene.fog = new THREE.FogExp2(0x87a8d0, 0.0025);

            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.set(0, 3, 20);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Lighting
            scene.add(new THREE.AmbientLight(0xffffff, 0.75));
            const sunLight = new THREE.DirectionalLight(0xfff6e5, 1.4);
            sunLight.position.set(80, 140, 80);
            sunLight.castShadow = true;
            scene.add(sunLight);

            // Ground & Roads
            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(800, 800),
                new THREE.MeshStandardMaterial({ color: 0x2d5a27, roughness: 0.9 })
            );
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            const roadMat = new THREE.MeshStandardMaterial({ color: 0x26292e, roughness: 0.8 });
            
            // Standard Grid Roads
            [-160, -80, 0, 80, 160].forEach(pos => {
                const roadNS = new THREE.Mesh(new THREE.PlaneGeometry(16, 600), roadMat);
                roadNS.rotation.x = -Math.PI / 2;
                roadNS.position.set(pos, 0.02, 0);
                scene.add(roadNS);

                const roadEW = new THREE.Mesh(new THREE.PlaneGeometry(600, 16), roadMat);
                roadEW.rotation.x = -Math.PI / 2;
                roadEW.position.set(0, 0.03, pos);
                scene.add(roadEW);
            });

            // ==========================================
            // EAST CORNER CUL-DE-SAC
            // ==========================================
            const culDeSacGroup = new THREE.Group();
            culDeSacGroup.position.set(160, 0.04, -120); // East corner neighborhood loop

            // Circular Cul-de-sac asphalt bulb
            const bulbGeo = new THREE.CircleGeometry(24, 32);
            const bulbMesh = new THREE.Mesh(bulbGeo, roadMat);
            bulbMesh.rotation.x = -Math.PI / 2;
            culDeSacGroup.add(bulbMesh);

            // Connecting street stub back to main grid
            const stubGeo = new THREE.PlaneGeometry(16, 45);
            const stubMesh = new THREE.Mesh(stubGeo, roadMat);
            stubMesh.rotation.x = -Math.PI / 2;
            stubMesh.position.set(0, 0, 25);
            culDeSacGroup.add(stubMesh);

            scene.add(culDeSacGroup);

            // Storefront Buildings
            const buildingMat = new THREE.MeshStandardMaterial({ color: 0x8f3b2e, roughness: 0.85 });
            const metalTrimMat = new THREE.MeshStandardMaterial({ color: 0x333840, metalness: 0.6 });
            const windowGlassMat = new THREE.MeshStandardMaterial({ color: 0x1c3545, metalness: 0.85, roughness: 0.1 });

            function createBuilding(x, z, w, h, d) {
                const bld = new THREE.Group();
                const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), buildingMat);
                body.position.set(0, h / 2, 0);
                body.castShadow = true;
                body.receiveShadow = true;
                bld.add(body);

                const cornice = new THREE.Mesh(new THREE.BoxGeometry(w + 0.5, 0.55, d + 0.5), metalTrimMat);
                cornice.position.set(0, h + 0.25, 0);
                bld.add(cornice);

                const glass = new THREE.Mesh(new THREE.BoxGeometry(w * 0.5, h * 0.35, 0.12), windowGlassMat);
                glass.position.set(-w * 0.12, h * 0.35, d / 2 + 0.03);
                bld.add(glass);

                bld.position.set(x, 0, z);
                scene.add(bld);
            }

            // Populate clean grid blocks
            const blockPositions = [-120, -40, 40, 120];
            for (let xi of blockPositions) {
                for (let zi of blockPositions) {
                    if (Math.abs(xi) < 25 && Math.abs(zi) < 25) continue;
                    createBuilding(xi - 25, zi - 45, 22, 10, 16);
                }
            }

            // Props & Houses Group (LocalStorage Persistence)
            const propsGroup = new THREE.Group();
