<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Badabing - Mobile Controls & God Mode</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a24;
            font-family: sans-serif;
            color: #fff;
            user-select: none;
            -webkit-user-select: none;
        }
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(20, 20, 28, 0.95);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            z-index: 10;
            width: 290px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        h1 { margin: 0 0 5px 0; font-size: 18px; color: #ff5555; }
        p { margin: 0 0 6px 0; font-size: 12px; color: #ccc; }
        #status { font-weight: bold; color: #55ff55; }

        /* Toggle Button */
        #toggle-god-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(20, 20, 28, 0.95);
            border: 1px solid #00aaff;
            color: #00aaff;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            z-index: 15;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            transition: 0.2s;
        }
        #toggle-god-btn:hover { background: #00aaff; color: #fff; }

        #god-mode-panel {
            position: absolute;
            top: 70px;
            right: 20px;
            background: rgba(20, 20, 28, 0.95);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #00aaff;
            z-index: 15;
            width: 250px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: none; /* Toggled via button */
        }
        #god-mode-panel h2 { margin: 0 0 10px 0; font-size: 15px; color: #00aaff; }
        .station-btn {
            display: block;
            width: 100%;
            padding: 9px;
            margin-bottom: 8px;
            background: #2a2a38;
            border: 1px solid #4a4a5e;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            text-align: left;
            font-size: 13px;
            transition: 0.2s;
        }
        .station-btn:hover { background: #00aaff; border-color: #00aaff; }
        .station-btn.active { background: #0088cc; border-color: #fff; font-weight: bold; }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
        }
        #controls-hint {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(20, 20, 28, 0.9);
            padding: 12px 18px;
            border-radius: 6px;
            border: 1px solid #444;
            font-size: 12px;
            color: #ddd;
            z-index: 10;
            line-height: 1.5;
        }
        #controls-hint span { color: #00aaff; font-weight: bold; }

        /* Virtual Mobile On-Screen Controls */
        #mobile-controls {
            display: none;
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 25;
        }
        #virtual-joystick {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 130px;
            height: 130px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            pointer-events: auto;
            touch-action: none;
        }
        #joystick-thumb {
            position: absolute;
            top: 40px;
            left: 40px;
            width: 50px;
            height: 50px;
            background: rgba(0, 170, 255, 0.7);
            border: 2px solid #fff;
            border-radius: 50%;
            pointer-events: none;
            transition: transform 0.05s linear;
        }
        #mobile-action-btns {
            position: absolute;
            bottom: 40px;
            right: 40px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            pointer-events: auto;
        }
        .mob-btn {
            width: 65px;
            height: 65px;
            background: rgba(0, 170, 255, 0.6);
            border: 2px solid #fff;
            border-radius: 50%;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            touch-action: manipulation;
        }
        .mob-btn:active { background: rgba(0, 170, 255, 0.9); }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

    <div id="crosshair"></div>

    <div id="info-panel">
        <h1>The Badabing 🦫</h1>
        <p>Status: <span id="status">Active (Mobile & God Mode)</span></p>
        <p>Peanut's Pos: <span id="coords">X: 0, Z: 0</span></p>
        <p>Cam Mode: <span id="cam-mode" style="color: #00aaff;">1st-Person Walkthrough</span></p>
    </div>

    <!-- Toggle Button -->
    <button id="toggle-god-btn">🛠️ God Mode</button>

    <div id="god-mode-panel">
        <h2>God Mode Inspector</h2>
        <p style="color: #00aaff; font-weight: bold; margin-bottom: 8px;">Target: X: <span id="target-x">0</span>, Z: <span id="target-z">0</span></p>
        <p>Select item to place / delete:</p>
        <button class="station-btn" data-type="workbench">🛠️ Industrial Workbench</button>
        <button class="station-btn" data-type="crate">📦 Storage Crate Stack</button>
        <button class="station-btn" data-type="bed
