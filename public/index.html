<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Badabing - Standalone 3D World</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a24;
            font-family: sans-serif;
            color: #fff;
            user-select: none;
        }
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(20, 20, 28, 0.95);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            z-index: 10;
            width: 290px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        h1 { margin: 0 0 5px 0; font-size: 18px; color: #ff5555; }
        p { margin: 0 0 6px 0; font-size: 12px; color: #ccc; }
        #status { font-weight: bold; color: #55ff55; }

        #god-mode-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(20, 20, 28, 0.95);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #00aaff;
            z-index: 10;
            width: 240px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        #god-mode-panel h2 { margin: 0 0 10px 0; font-size: 15px; color: #00aaff; }
        .station-btn {
            display: block;
            width: 100%;
            padding: 9px;
            margin-bottom: 8px;
            background: #2a2a38;
            border: 1px solid #4a4a5e;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            text-align: left;
            font-size: 13px;
            transition: 0.2s;
        }
        .station-btn:hover { background: #00aaff; border-color: #00aaff; }
        .station-btn.active { background: #0088cc; border-color: #fff; font-weight: bold; }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
        }
        #controls-hint {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(20, 20, 28, 0.9);
            padding: 12px 18px;
            border-radius: 6px;
            border: 1px solid #444;
            font-size: 12px;
            color: #ddd;
            z-index: 10;
            line-height: 1.5;
        }
        #controls-hint span { color: #00aaff; font-weight: bold; }
    </style>

    <!-- Load Three.js and PointerLockControls reliably via standard scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

    <div id="crosshair"></div>

    <div id="info-panel">
        <h1>The Badabing 🦫</h1>
        <p>Status: <span id="status">Active (World Loaded)</span></p>
        <p>Peanut's Pos: <span id="coords">X: 0, Z: 0</span></p>
        <p>Cam Mode: <span id="cam-mode" style="color: #00aaff;">1st-Person Walkthrough</span></p>
    </div>

    <div id="god-mode-panel">
        <h2>Admin Builder Tools</h2>
        <p>Press <b>ESC</b> to unlock mouse:</p>
        <button class="station-btn" data-type="workbench">🛠️ Industrial Workbench</button>
        <button class="station-btn" data-type="crate">📦 Storage Crate Stack</button>
        <button class="station-btn" data-type="bed">🛌 Recovery Pod</button>
        <button class="station-btn" data-type="none" style="background: #333;">✋ Hands Empty (Look Mode)</button>
    </div>

    <div id="controls-hint">
        Click Scene: <span>Lock Mouse Look</span> | Walk: <span>WASD</span><br>
        Fly Up/Down: <span>Space / Shift</span> | Place Prop: <span>Left Click</span>
    </div>

    <script>
        try {
            console.log("🚀 Initializing 3D World...");

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87a8d0);
            scene.fog = new THREE.FogExp2(0x87a8d0, 0.004);

            const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1500);
            camera.position.set(0, 2.5, 20);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Lighting
            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const sunLight = new THREE.DirectionalLight(0xfff6e5, 1.3);
            sunLight.position.set(50, 100, 50);
            sunLight.castShadow = true;
            scene.add(sunLight);

            // Ground (Green Grass)
            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(300, 300),
                new THREE.MeshStandardMaterial({ color: 0x2d5a27, roughness: 0.9 })
            );
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Asphalt Roads
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x26292e, roughness: 0.8 });
            const roadNS = new THREE.Mesh(new THREE.PlaneGeometry(16, 250), roadMat);
            roadNS.rotation.x = -Math.PI / 2;
            roadNS.position.set(0, 0.02, 0);
            scene.add(roadNS);

            const roadEW = new THREE.Mesh(new THREE.PlaneGeometry(250, 16), roadMat);
            roadEW.rotation.x = -Math.PI / 2;
            roadEW.position.set(0, 0.03, 0);
            scene.add(roadEW);

            // Buildings
            const buildingMat = new THREE.MeshStandardMaterial({ color: 0x8f3b2e, roughness: 0.85 });
            function createBuilding(x, z, w, h, d) {
                const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), buildingMat);
                body.position.set(x, h / 2, z);
                body.castShadow = true;
                body.receiveShadow = true;
                scene.add(body);
            }
            createBuilding(0, -35, 24, 10, 16);
            createBuilding(35, 0, 20, 9, 16);
            createBuilding(-35, 0, 20, 9, 16);
            createBuilding(0, 35, 22, 10, 16);

            // Peanut the Bird with Animated Eyes
            const peanutGroup = new THREE.Group();
            scene.add(peanutGroup);
            peanutGroup.position.set(0, 0, 5);

            const featherMat = new THREE.MeshStandardMaterial({ color: 0xff8c00 });
            const beakMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b });

            const birdBody = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 16), featherMat);
            birdBody.scale.set(1, 0.8, 1.3);
            birdBody.position.y = 0.6;
            birdBody.castShadow = true;
            peanutGroup.add(birdBody);

            const birdHead = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), featherMat);
            birdHead.position.set(0, 1.0, 0.3);
            peanutGroup.add(birdHead);

            const birdBeak = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.35, 8), beakMat);
            birdBeak.rotateX(Math.PI / 2);
            birdBeak.position.set(0, 0.95, 0.62);
            peanutGroup.add(birdBeak);

            // Animated Eyes
            const eyeGroup = new THREE.Group();
            peanutGroup.add(eyeGroup);

            const eyeballMat = new THREE.MeshBasicMaterial({ color: 0x050505 });
            const pupilMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

            const leftEye = new THREE.Group();
            leftEye.position.set(-0.13, 1.05, 0.52);
            leftEye.add(new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), eyeballMat));
            const lPupil = new THREE.Mesh(new THREE.SphereGeometry(0.03, 8, 8), pupilMat);
            lPupil.position.set(0.02, 0.02, 0.05);
            leftEye.add(lPupil);

            const rightEye = new THREE.Group();
            rightEye.position.set(0.13, 1.05, 0.52);
            rightEye.add(new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), eyeballMat));
            const rPupil = new THREE.Mesh(new THREE.SphereGeometry(0.03, 8, 8), pupilMat);
            rPupil.position.set(-0.02, 0.02, 0.05);
            rightEye.add(rPupil);

            eyeGroup.add(leftEye, rightEye);

            // Props group
            const propsGroup = new THREE.Group();
            scene.add(propsGroup);

            // Controls & Movement
            const controls = new THREE.PointerLockControls(camera, renderer.domElement);
            let selectedTool = null;

            renderer.domElement.addEventListener('click', () => {
                if (!controls.isLocked) {
                    controls.lock();
                    return;
                }
                if (selectedTool) {
                    const raycaster = new THREE.Raycaster();
                    raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
                    const hits = raycaster.intersectObject(ground);
                    if (hits.length > 0) {
                        const pt = hits[0].point;
                        const propMat = new THREE.MeshStandardMaterial({ color: selectedTool === 'workbench' ? 0x7c471b : 0xbd7d4b });
                        const prop = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.8, 1.2), propMat);
                        prop.position.set(Math.round(pt.x), 0.4, Math.round(pt.z));
                        prop.castShadow = true;
                        propsGroup.add(prop);
                    }
                }
            });

            document.querySelectorAll('.station-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.station-btn').forEach(b => b.classList.remove('active'));
                    const type = e.currentTarget.getAttribute('data-type');
                    selectedTool = (type === 'none') ? null : type;
                    if (selectedTool) e.currentTarget.classList.add('active');
                    controls.lock();
                });
            });

            const keys = { w: false, a: false, s: false, d: false, up: false, down: false };
            window.addEventListener('keydown', (e) => {
                const k = e.key.toLowerCase();
                if (k === 'w' || e.key === 'arrowup') keys.w = true;
                if (k === 's' || e.key === 'arrowdown') keys.s = true;
                if (k === 'a' || e.key === 'arrowleft') keys.a = true;
                if (k === 'd' || e.key === 'arrowright') keys.d = true;
                if (e.code === 'Space') keys.up = true;
                if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') keys.down = true;
            });
            window.addEventListener('keyup', (e) => {
                const k = e.key.toLowerCase();
                if (k === 'w' || e.key === 'arrowup') keys.w = false;
                if (k === 's' || e.key === 'arrowdown') keys.s = false;
                if (k === 'a' || e.key === 'arrowleft') keys.a = false;
                if (k === 'd' || e.key === 'arrowright') keys.d = false;
                if (e.code === 'Space') keys.up = false;
